<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark light">
  <title>Agent CLI</title>
  <style>
    /* ---------------------------------------------------------------
       Fonts. Mitr carries the Thai glyphs; the Latin system faces stay
       first in the stack so ASCII text keeps its familiar shape. The
       files are served from /fonts by the same static handler as this
       document, one subset per unicode-range.
       --------------------------------------------------------------- */
    @font-face {
      font-family: 'Mitr';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/mitr-400-thai.woff2') format('woff2');
      unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC;
    }
    @font-face {
      font-family: 'Mitr';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/mitr-400-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Mitr';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/mitr-400-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    /* ---------------------------------------------------------------
       Tokens. Spacing follows a 4px scale so the vertical rhythm stays
       even; the three column widths are the only layout magic numbers.
       Every surface colour is a variable, so the light theme is a pure
       variable swap (see [data-theme="light"] below).
       --------------------------------------------------------------- */
    :root {
      --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
      --sp-5: 24px; --sp-6: 32px;

      --bg: #212121;
      --bg-sidebar: #171717;
      --bg-elev: #2f2f2f;
      --bg-elev-2: #262626;
      --bg-sunken: #0f0f0f;
      --bg-hover: #2a2a2a;
      --border: #3a3a3a;
      --border-soft: #2a2a2a;

      --text: #ececec;
      --text-dim: #b4b4b4;
      --text-mute: #8e8e8e;

      --accent: #d97757;
      --ok: #3fb950;
      --warn: #d29922;
      --err: #f85149;
      --link: #7ab7ff;

      /* surfaces that used to be hard-coded, so the light theme can swap them */
      --bg-raised: #1c1c1c;
      --bg-raised-2: #232323;
      --bg-inset: #1a1a1a;
      --bg-code-head: #151515;
      --bg-input: #121212;
      --bg-sunken-2: #101010;
      --bg-hover-2: #212121;
      --bg-primary: #ececec;
      --fg-primary: #111111;
      --bg-brand-btn: #242424;
      --border-brand-btn: #303030;
      --bg-chip: #3a3a3a;
      --border-chip: #4a4a4a;
      --bg-chip-hover: #454545;
      --bg-btn-hover: #333333;
      --border-strong: #454545;
      --border-stronger: #5c5c5c;
      --border-inset: #242424;
      --border-danger: #4a2020;
      --bg-danger: #2a1a1a;
      --bg-toast: #2e2e2e;
      --border-toast: #3d3d3d;
      --code-text: #d4d4d4;
      --placeholder: #9a9a9a;
      --send-bg: #3a3a3a;
      --send-fg: #6d6d6d;
      --avatar-fg: #1b1b1b;
      --bg-drawer: rgba(23, 23, 23, .82);
      --overlay-bg: rgba(0, 0, 0, .55);
      --backdrop-bg: rgba(0, 0, 0, .5);
      --shadow-soft: rgba(0, 0, 0, .28);
      --shadow-mid: rgba(0, 0, 0, .38);
      --shadow-modal: rgba(0, 0, 0, .5);
      --shadow-toast: rgba(0, 0, 0, .4);
      --tok-kw: #c586c0;
      --tok-str: #ce9178;
      --tok-com: #6a9955;
      --tok-num: #b5cea8;
      --tok-typ: #4ec9b0;

      --sidebar-w: 264px;
      --sidebar-min: 200px;
      --sidebar-max: 400px;
      --sidebar-rail: 56px;
      --panel-w: 320px;
      --topbar-h: 52px;
      --column-w: 720px;
      --radius: 10px;
      --radius-lg: 18px;

      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --sans: 'Inter', 'Segoe UI', 'SF Pro Display', 'Helvetica Neue', 'Arial', 'Noto Sans Thai', 'Mitr', sans-serif;

      --ease: cubic-bezier(.22, .61, .36, 1);
      --fast: 140ms;
      --med: 220ms;

      color-scheme: dark;
    }

    [data-theme="light"] {
      --bg: #f8f8f8;
      --bg-sidebar: #ffffff;
      --bg-elev: #ffffff;
      --bg-elev-2: #f0f0f0;
      --bg-sunken: #e8e8e8;
      --bg-hover: #ececec;
      --border: #ddd;
      --border-soft: #e5e5e5;
      --text: #1a1a1a;
      --text-dim: #555;
      --text-mute: #888;
      --accent: #c05020;
      --ok: #22863a;
      --warn: #e36209;
      --err: #cb2431;
      --link: #0366d6;

      --bg-raised: #ffffff;
      --bg-raised-2: #f2f2f2;
      --bg-inset: #ffffff;
      --bg-code-head: #efefef;
      --bg-input: #ffffff;
      --bg-sunken-2: #f2f2f2;
      --bg-hover-2: #ececec;
      --bg-primary: #1a1a1a;
      --fg-primary: #ffffff;
      --bg-brand-btn: #f0f0f0;
      --border-brand-btn: #ddd;
      --bg-chip: #f0f0f0;
      --border-chip: #ddd;
      --bg-chip-hover: #e6e6e6;
      --bg-btn-hover: #e8e8e8;
      --border-strong: #ccc;
      --border-stronger: #b0b0b0;
      --border-inset: #e5e5e5;
      --border-danger: #f0c0c0;
      --bg-danger: #fdecea;
      --bg-toast: #ffffff;
      --border-toast: #ddd;
      --code-text: #24292e;
      --placeholder: #888;
      --send-bg: #e0e0e0;
      --send-fg: #9a9a9a;
      --avatar-fg: #ffffff;
      --bg-drawer: rgba(255, 255, 255, .86);
      --overlay-bg: rgba(0, 0, 0, .35);
      --backdrop-bg: rgba(0, 0, 0, .28);
      --shadow-soft: rgba(0, 0, 0, .08);
      --shadow-mid: rgba(0, 0, 0, .14);
      --shadow-modal: rgba(0, 0, 0, .2);
      --shadow-toast: rgba(0, 0, 0, .14);
      --tok-kw: #a626a4;
      --tok-str: #986801;
      --tok-com: #6a737d;
      --tok-num: #098658;
      --tok-typ: #267f99;

      color-scheme: light;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body { height: 100%; }
    /* The stack is repeated literally so it survives tooling that cannot
       resolve custom properties; --sans stays the single source of truth. */
    html { font-family: 'Inter', 'Segoe UI', 'SF Pro Display', 'Helvetica Neue', 'Arial', 'Noto Sans Thai', 'Mitr', sans-serif; }
    body {
      font-family: var(--sans);
      letter-spacing: -0.01em;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background-color .3s, color .3s;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    input, textarea { font: inherit; }
    :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

    /* Icons: one inline sprite, referenced by id, sized by the .ico box. */
    .ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor;
           stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
