<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent CLI - AI Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --text-primary: #c9d1d9;
      --text-secondary: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --border: #30363d;
      --success: #3fb950;
      --error: #f85149;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 260px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .sidebar-header {
      margin-bottom: 16px;
    }

    .new-chat-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .new-chat-btn:hover {
      background: var(--accent-hover);
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      margin-top: 16px;
    }

    .chat-item {
      padding: 10px 12px;
      margin-bottom: 4px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-secondary);
      transition: all 0.2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-item:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .chat-item.active {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 60px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .header-title {
      font-size: 16px;
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      padding: 8px 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .message-group {
      display: flex;
      gap: 16px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .message-group.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      flex-shrink: 0;
    }

    .message-group.user .avatar {
      background: var(--success);
    }

    .message-content {
      flex: 1;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .message-group.user .message-content {
      background: var(--bg-tertiary);
    }

    .message-text {
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .tool-execution {
      margin-top: 12px;
      padding: 12px;
      background: var(--bg-tertiary);
      border-radius: 8px;
      border-left: 3px solid var(--accent);
      font-size: 13px;
    }

    .tool-name {
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .tool-output {
      color: var(--text-secondary);
      font-family: 'Monaco', 'Courier New', monospace;
    }

    .input-area {
      padding: 16px 24px 24px;
      background: var(--bg-primary);
    }

    .input-wrapper {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
    }

    .input-container {
      display: flex;
      gap: 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      transition: border-color 0.2s;
    }

    .input-container:focus-within {
      border-color: var(--accent);
    }

    .message-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      resize: none;
      min-height: 24px;
      max-height: 200px;
    }

    .send-button {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .send-button:hover {
      background: var(--accent-hover);
    }

    .send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .thinking {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .thinking-dots {
      display: flex;
      gap: 4px;
    }

    .thinking-dot {
      width: 6px;
      height: 6px;
      background: var(--text-secondary);
      border-radius: 50%;
      animation: thinking 1.4s infinite;
    }

    .thinking-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .thinking-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes thinking {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }

    .stats-bar {
      margin-top: 8px;
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: var(--text-secondary);
      justify-content: center;
    }

    .stat {
      display: flex;
      gap: 4px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      text-align: center;
      padding: 24px;
    }

    .empty-state h1 {
      font-size: 32px;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .empty-state p {
      font-size: 16px;
      margin-bottom: 32px;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 600px;
      width: 100%;
    }

    .suggestion-card {
      padding: 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }

    .suggestion-card:hover {
      background: var(--bg-tertiary);
      border-color: var(--accent);
    }

    .suggestion-title {
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .suggestion-desc {
      font-size: 13px;
      color: var(--text-secondary);
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--bg-tertiary);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--border);
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
      </div>
      <div class="chat-list" id="chatList">
        <div class="chat-item active">Current Conversation</div>
      </div>
    </aside>

    <main class="main-content">
      <header class="header">
        <div class="header-title">Agent CLI</div>
        <div class="header-actions">
          <button class="icon-btn" onclick="showStats()">Stats</button>
          <button class="icon-btn" onclick="clearChat()">Clear</button>
        </div>
      </header>

      <div class="chat-area" id="chatArea">
        <div class="empty-state" id="emptyState">
          <h1>Agent CLI</h1>
          <p>Your AI-powered development assistant</p>
          <div class="suggestions">
            <div class="suggestion-card" onclick="useSuggestion('List files in current directory')">
              <div class="suggestion-title">List Files</div>
              <div class="suggestion-desc">Show directory contents</div>
            </div>
            <div class="suggestion-card" onclick="useSuggestion('Create a React component')">
              <div class="suggestion-title">Create Component</div>
              <div class="suggestion-desc">Generate code</div>
            </div>
            <div class="suggestion-card" onclick="useSuggestion('Search for TODO comments')">
              <div class="suggestion-title">Search Code</div>
              <div class="suggestion-desc">Find in codebase</div>
            </div>
            <div class="suggestion-card" onclick="useSuggestion('Run tests')">
              <div class="suggestion-title">Run Tests</div>
              <div class="suggestion-desc">Execute test suite</div>
            </div>
          </div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <div class="input-container">
            <textarea
              id="messageInput"
              class="message-input"
              placeholder="Type your message..."
              rows="1"
              onkeydown="handleKeyDown(event)"
              oninput="autoResize(this)"
            ></textarea>
            <button class="send-button" onclick="sendMessage()" id="sendBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
              </svg>
            </button>
          </div>
          <div class="stats-bar" id="statsBar" style="display: none;">
            <div class="stat">
              <span>Calls:</span>
              <span id="totalCalls">0</span>
            </div>
            <div class="stat">
              <span>Success:</span>
              <span id="successRate">100%</span>
            </div>
            <div class="stat">
              <span>Avg Time:</span>
              <span id="avgTime">0ms</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    let messageCount = 0;
    let stats = { total: 0, success: 0, totalTime: 0 };
    let isProcessing = false;

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
    }

    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    function useSuggestion(text) {
      document.getElementById('messageInput').value = text;
      sendMessage();
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const message = input.value.trim();

      if (!message || isProcessing) return;

      const emptyState = document.getElementById('emptyState');
      if (emptyState) {
        emptyState.remove();
      }

      input.value = '';
      input.style.height = 'auto';
      isProcessing = true;
      document.getElementById('sendBtn').disabled = true;

      addMessage('user', message);
      showThinking();

      setTimeout(() => {
        const startTime = Date.now();

        fetch('/api/agent/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        })
        .then(res => res.json())
        .then(data => {
          removeThinking();
          const duration = Date.now() - startTime;

          addMessage('assistant', data.response || getDemoResponse(message), data.toolExecutions);

          stats.total++;
          stats.success++;
          stats.totalTime += duration;
          updateStats();

          isProcessing = false;
          document.getElementById('sendBtn').disabled = false;
        })
        .catch(err => {
          removeThinking();
          const duration = Date.now() - startTime;

          addMessage('assistant', getDemoResponse(message));

          stats.total++;
          stats.success++;
          stats.totalTime += duration;
          updateStats();

          isProcessing = false;
          document.getElementById('sendBtn').disabled = false;
        });
      }, 500);
    }

    function getDemoResponse(message) {
      const responses = {
        'list': 'Demo: Would list files in current directory.\n\nTo enable full functionality:\n1. npm install\n2. npm run build\n3. npm run start:agent',
        'create': 'Demo: Would create the requested component.\n\nFull agent integration coming soon!',
        'search': 'Demo: Would search the codebase.\n\nConnect to full Agent CLI for real functionality.',
        'test': 'Demo: Would run tests.\n\nThis is a UI demo. Full features require backend setup.'
      };

      for (const key in responses) {
        if (message.toLowerCase().includes(key)) {
          return responses[key];
        }
      }

      return `Received: "${message}"\n\nThis is a standalone demo UI inspired by Chatbot UI.\n\nFeatures:\n- Modern chat interface\n- Message history\n- Tool execution display\n- Real-time stats\n- Responsive design\n\nTo enable full Agent CLI functionality, connect to backend server.`;
    }

    function addMessage(role, text, toolExecutions = []) {
      const chatArea = document.getElementById('chatArea');

      const messageGroup = document.createElement('div');
      messageGroup.className = `message-group ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? 'U' : 'AI';

      const content = document.createElement('div');
      content.className = 'message-content';

      const messageText = document.createElement('div');
      messageText.className = 'message-text';
      messageText.textContent = text;
      content.appendChild(messageText);

      if (toolExecutions && toolExecutions.length > 0) {
        toolExecutions.forEach(exec => {
          const toolDiv = document.createElement('div');
          toolDiv.className = 'tool-execution';

          const toolName = document.createElement('div');
          toolName.className = 'tool-name';
          toolName.textContent = `Tool: ${exec.tool}`;

          const toolOutput = document.createElement('div');
          toolOutput.className = 'tool-output';
          toolOutput.textContent = exec.result.success
            ? `Success: ${exec.result.output?.substring(0, 100)}...`
            : `Error: ${exec.result.error}`;

          toolDiv.appendChild(toolName);
          toolDiv.appendChild(toolOutput);
          content.appendChild(toolDiv);
        });
      }

      messageGroup.appendChild(avatar);
      messageGroup.appendChild(content);
      chatArea.appendChild(messageGroup);
      chatArea.scrollTop = chatArea.scrollHeight;

      messageCount++;
    }

    function showThinking() {
      const chatArea = document.getElementById('chatArea');
      const thinkingDiv = document.createElement('div');
      thinkingDiv.id = 'thinkingIndicator';
      thinkingDiv.className = 'message-group';
      thinkingDiv.innerHTML = `
        <div class="avatar">AI</div>
        <div class="message-content">
          <div class="thinking">
            <span>Thinking</span>
            <div class="thinking-dots">
              <div class="thinking-dot"></div>
              <div class="thinking-dot"></div>
              <div class="thinking-dot"></div>
            </div>
          </div>
        </div>
      `;
      chatArea.appendChild(thinkingDiv);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function removeThinking() {
      const indicator = document.getElementById('thinkingIndicator');
      if (indicator) indicator.remove();
    }

    function updateStats() {
      const successRate = stats.total > 0 ? Math.round((stats.success / stats.total) * 100) : 100;
      const avgTime = stats.total > 0 ? Math.round(stats.totalTime / stats.total) : 0;

      document.getElementById('totalCalls').textContent = stats.total;
      document.getElementById('successRate').textContent = successRate + '%';
      document.getElementById('avgTime').textContent = avgTime + 'ms';
    }

    function showStats() {
      const statsBar = document.getElementById('statsBar');
      statsBar.style.display = statsBar.style.display === 'none' ? 'flex' : 'none';
    }

    function clearChat() {
      const chatArea = document.getElementById('chatArea');
      chatArea.innerHTML = `
        <div class="empty-state" id="emptyState">
          <h1>Agent CLI</h1>
          <p>Your AI-powered development assistant</p>
          <div class="suggestions">
            <div class="suggestion-card" onclick="useSuggestion('List files in current directory')">
              <div class="suggestion-title">List Files</div>
              <div class="suggestion-desc">Show directory contents</div>
            </div>
            <div class="suggestion-card" onclick="useSuggestion('Create a React component')">
              <div class="suggestion-title">Create Component</div>
              <div class="suggestion-desc">Generate code</div>
            </div>
            <div class="suggestion-card" onclick="useSuggestion('Search for TODO comments')">
              <div class="suggestion-title">Search Code</div>
              <div class="suggestion-desc">Find in codebase</div>
            </div>
            <div class="suggestion-card" onclick="useSuggestion('Run tests')">
              <div class="suggestion-title">Run Tests</div>
              <div class="suggestion-desc">Execute test suite</div>
            </div>
          </div>
        </div>
      `;
      messageCount = 0;
      stats = { total: 0, success: 0, totalTime: 0 };
      updateStats();
    }

    function newChat() {
      clearChat();
    }

    document.getElementById('messageInput').focus();
  </script>
</body>
</html>
