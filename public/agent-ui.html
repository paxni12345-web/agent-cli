/* ==================== 8.2) กระบวนการสร้างคำตอบ (ส่ง/สตรีม/หยุด/ลองใหม่) ==================== */

/* สร้าง element ข้อความบอทเปล่าพร้อม typing indicator */
function appendTyping(){
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  wrap.innerHTML = `
    <div class="msg-avatar" aria-hidden="true"><svg width="19" height="19"><use href="#i-sprout"/></svg></div>
    <div class="msg-body"><div class="typing" aria-label="กำลังพิมพ์"><span></span><span></span><span></span></div><div class="live-activity"></div></div>`;
  $('#chatContainer').appendChild(wrap);
  maybeAutoScroll();
  return wrap;
}

/* ฟังก์ชันหลัก: ส่งข้อความผู้ใช้แล้วให้บอทตอบ */
function sendMessage(){
  const input = $('#input');
  const text = input.value.trim();
  if ((!text && !state.attachments.length) || state.generating) return;

  let chat = currentChat();
  if (!chat) chat = createChat();
  if (pub.active && chat.remote && !chat.loaded){ toast('กำลังโหลดแชท รอสักครู่…'); return; }

  const msg = {
    id: uid(), role: 'user', text, time: Date.now(),
    attachments: state.attachments.length ? state.attachments.slice() : undefined,
  };
  chat.messages.push(msg);
  chat.updatedAt = Date.now();
  if (chat.messages.length === 1) autoTitle(chat, text || chat.messages[0].attachments[0].name);
  saveChats();

  /* เคลียร์ช่องพิมพ์และไฟล์แนบ */
  input.value = ''; autoResize(); updateSendState();
  state.attachments = []; renderChips();

  renderChatList(); renderConversation();
  generateReply(chat);
}

/* ให้บอทตอบ (ใช้ทั้งตอนส่งใหม่ / regenerate / retry) */
async function generateReply(chat, targetMsg){
  state.generating = true;
  updateSendState();

  /* สร้าง message object ของบอท */
  let msg = targetMsg;
  if (!msg){
    msg = { id: uid(), role: 'assistant', versions: [], vi: 0, rating: null };
    chat.messages.push(msg);
  }

  const typingEl = appendTyping();
  activityEl = typingEl.querySelector('.live-activity');
  const abort = new AbortController();
  state.abortCtrl = abort;

  /* เตรียม DOM สำหรับสตรีม */
  let mdEl = null, actionsEl = null, acc = '';
  const startStreamUI = () => {
    typingEl.querySelector('.typing')?.remove();
    typingEl.querySelector('.live-activity')?.remove();
    mdEl = document.createElement('div');
    mdEl.className = 'md streaming-cursor';
    typingEl.querySelector('.msg-body').appendChild(mdEl);
    actionsEl = document.createElement('div');
    actionsEl.className = 'msg-actions sticky';
    typingEl.querySelector('.msg-body').appendChild(actionsEl);
  };

  /* throttle การเรนเดอร์ Markdown ระหว่างสตรีม */
  let renderPending = false;
  const scheduleRender = () => {
    if (renderPending) return;
    renderPending = true;
    requestAnimationFrame(() => {
      renderPending = false;
      if (mdEl){ mountMarkdown(mdEl, acc); maybeAutoScroll(); }
    });
  };

  try{
    let meta = null;
    const req = await prepareRequest(chat, msg);
    const reply = await callChatAPI({
      ...req,
      chat,
      signal: abort.signal,
      onMeta: m => { meta = m; },
      onToken: chunk => {
        acc += chunk;
        if (!mdEl) startStreamUI();
        scheduleRender();
      },
    });

    /* สตรีมจบ: บันทึกเวอร์ชันใหม่ */
    msg.versions.push({ text: reply || acc, time: Date.now(), tools: meta && meta.tools && meta.tools.length ? meta.tools : undefined });
    serverCtx = { chatId: chat.id, count: chat.messages.findIndex(x => x.id === msg.id) + 1 };
    msg.vi = msg.versions.length - 1;
    chat.updatedAt = Date.now();
    saveChats();
  }catch(err){
    typingEl.remove();
    serverCtx.chatId = null;   // ไม่แน่ใจว่าเอเจนต์ฝั่งเซิร์ฟเวอร์จำอะไรไว้ → ส่งบริบทซ้ำครั้งหน้า
    if (err && err.name === 'AbortError'){
      /* ผู้ใช้กดหยุด — เก็บข้อความที่สตรีมมาแล้วไว้ถ้ามี */
      if (acc){
        msg.versions.push({ text: acc + '\n\n*(หยุดการตอบโดยผู้ใช้)*', time: Date.now() });
        msg.vi = msg.versions.length - 1;
        chat.updatedAt = Date.now(); saveChats();
      } else if (!targetMsg){
        chat.messages = chat.messages.filter(x => x.id !== msg.id);
      }
      finishGeneration(chat);
      return;
    }
    /* แสดงกล่อง error พร้อมปุ่มลองใหม่ */
    if (!targetMsg) chat.messages = chat.messages.filter(x => x.id !== msg.id);
    finishGeneration(chat);
    appendErrorBox(err, chat, targetMsg);
    return;
  }

  finishGeneration(chat);
}

function finishGeneration(chat){
  state.generating = false;
  activityEl = null;
  state.abortCtrl = null;
  updateSendState();
  renderChatList(); renderConversation();
  scrollToBottom(false);
}

/* กล่องแสดงข้อผิดพลาด + ปุ่มลองใหม่ */
function appendErrorBox(err, chat, targetMsg){
  const typeText = {
    network: 'เครือข่ายมีปัญหา', auth: 'ต้องใช้ token ของเซิร์ฟเวอร์',
    rate: 'ถูกจำกัดการใช้งาน', api: 'เกิดข้อผิดพลาดจากเซิร์ฟเวอร์',
    config: 'ยังไม่ได้ตั้งค่า API key', busy: 'เอเจนต์กำลังทำงานอยู่',
  }[err.type] || 'เกิดข้อผิดพลาด';
  const box = document.createElement('div');
  box.className = 'msg assistant';
  box.innerHTML = `
    <div class="msg-avatar" aria-hidden="true"><svg width="19" height="19"><use href="#i-sprout"/></svg></div>
    <div class="msg-body"><div class="error-box" role="alert">
      <svg width="30" height="30" style="flex-shrink:0;margin-top:-2px" aria-hidden="true"><use href="#i-droop"/></svg>
      <div class="grow"><strong>${typeText}</strong><br>${escapeHtml(err.message || 'ไม่ทราบสาเหตุ')}</div>
      <button class="retry-btn">ลองใหม่</button>
    </div></div>`;
  box.querySelector('.retry-btn').addEventListener('click', () => {
    box.remove();
    if (!state.generating) generateReply(chat, targetMsg);
  });
  $('#chatContainer').appendChild(box);
  maybeAutoScroll();
}

/* Regenerate: สร้างคำตอบใหม่เป็น "เวอร์ชัน" ของข้อความเดิม */
function regenerate(m){
  const chat = currentChat();
  if (!chat) return;
  generateReply(chat, m);
}

/* ปุ่มหยุด (ยกเลิกด้วย AbortController) */
function stopGeneration(){
  if (state.abortCtrl) state.abortCtrl.abort();
  /* บอกเซิร์ฟเวอร์ให้หยุดงานที่ค้างอยู่ด้วย ไม่ใช่แค่เลิกรอคำตอบ */
  if (state.generating && !state.settings.mockMode && !pub.active) apiFetch('/api/agent/stop', { method:'POST' }).catch(() => {});
  if (window.speechSynthesis && speechSynthesis.speaking) speechSynthesis.cancel();
}

<script>
/* ==================== 9) COMPOSER — ช่องพิมพ์ ==================== */
const input = $('#input');
const sendBtn = $('#sendBtn');

/* Textarea ขยายอัตโนมัติตามเนื้อหา (สูงสุด 200px แล้วเลื่อนภายใน) */
function autoResize(){

  input.style.height = Math.min(input.scrollHeight, 200) + 'px';

/* อัปเดตสถานะปุ่มส่ง/หยุด + ตัวนับตัวอักษร/โทเค็น */
function updateSendState(){
  const len = input.value.length;
  $('#charCount').textContent = `${len} ตัวอักษร · ~${estTokens(input.value)} โทเค็น`;
  if (state.generating){
    sendBtn.disabled = false;
    sendBtn.classList.add('stop');
    sendBtn.innerHTML = '<svg width="14" height="14" aria-hidden="true"><use href="#i-stop"/></svg>';
    sendBtn.setAttribute('aria-label', 'หยุดการตอบ');
    sendBtn.title = 'หยุด';
  } else {
    sendBtn.classList.remove('stop');
    sendBtn.innerHTML = '<svg width="16" height="16" aria-hidden="true"><use href="#i-send"/></svg>';
    sendBtn.setAttribute('aria-label', 'ส่งข้อความ');
    sendBtn.title = 'ส่ง';
    sendBtn.disabled = !(input.value.trim() || state.attachments.length);
  }
}

input.addEventListener('input', () => { autoResize(); updateSendState(); });

/* Enter = ส่ง / Shift+Enter = บรรทัดใหม่ (สลับได้ใน Settings)
   ตรวจ isComposing เพื่อไม่ส่งตอนกำลังเลือกคำด้วย IME ภาษาไทย */
input.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const enterSends = state.settings.enterToSend;
  if ((enterSends && !e.shiftKey) || (!enterSends && e.shiftKey)){
    e.preventDefault();
    state.generating ? stopGeneration() : sendMessage();
  }
});

sendBtn.addEventListener('click', () => state.generating ? stopGeneration() : sendMessage());

/* ---- แนบไฟล์ (รูป/ข้อความ/PDF) ---- */
$('#attachBtn').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', e => {
  addFiles(Array.from(e.target.files));
  e.target.value = '';
});

function addFiles(files){
  if (pub.active){ toast('แชทนี้ยังไม่รองรับไฟล์แนบ', 'error'); return; }
  files.forEach(f => {
    if (f.size > 10 * 1048576){ toast(`ไฟล์ "${f.name}" ใหญ่เกิน 10 MB`, 'error'); return; }
    const item = { name: f.name, type: f.type || 'application/octet-stream', size: f.size };
    if (f.type.startsWith('image/')){
      const r = new FileReader();
      r.onload = () => { item.dataUrl = r.result; state.attachments.push(item); renderChips(); updateSendState(); };
      r.readAsDataURL(f);
    } else if (/text|json|csv|markdown/.test(f.type) || /\.(txt|md|csv|json|log)$/i.test(f.name)){
      const r = new FileReader();
      r.onload = () => { item.text = String(r.result || ''); state.attachments.push(item); renderChips(); updateSendState(); };
      r.readAsText(f);
    } else {
      state.attachments.push(item); renderChips(); updateSendState();
    }
  });
}

/* แสดงไฟล์แนบเป็นชิปเล็ก ๆ ลบได้ */
function renderChips(){
  const box = $('#attachChips');
  box.innerHTML = '';
  state.attachments.forEach((a, i) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = `
      ${a.dataUrl ? `<img src="${a.dataUrl}" alt="">` : '<svg width="13" height="13"><use href="#i-doc"/></svg>'}
      <span class="chip-name" title="${escapeHtml(a.name)} (${fmtBytes(a.size)})">${escapeHtml(a.name)}</span>
      <button class="chip-x" aria-label="ลบไฟล์ ${escapeHtml(a.name)}"><svg width="11" height="11"><use href="#i-x"/></svg></button>`;
    chip.querySelector('.chip-x').addEventListener('click', () => {
      state.attachments.splice(i, 1); renderChips(); updateSendState();
    });
    box.appendChild(chip);
  });
}

/* ลากวางไฟล์ลงในช่องพิมพ์ */

['dragover','dragenter'].forEach(ev => composerEl.addEventListener(ev, e => {

/* วางรูปจากคลิปบอร์ด */
input.addEventListener('paste', e => {
  const items = Array.from(e.clipboardData?.items || []);
  const imgs = items.filter(it => it.kind === 'file').map(it => it.getAsFile()).filter(Boolean);

/* ---- พิมพ์ด้วยเสียง (Web Speech API, ภาษาไทย th-TH) ---- */

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ toast('เบราว์เซอร์นี้ไม่รองรับการพิมพ์ด้วยเสียง', 'error'); return; }
  if (state.recording){ state.recognition.stop(); return; }
  const rec = new SR();
  rec.lang = 'th-TH'; rec.interimResults = true; rec.continuous = true;
  rec.onresult = e => {
    let final = '';
    for (const r of e.results) if (r.isFinal) final += r[0].transcript;
    if (final){
      input.value = (input.value + (input.value && !input.value.endsWith(' ') ? ' ' : '') + final.trim());
      autoResize(); updateSendState();
    }
  };
  rec.onend = () => { state.recording = false; $('#micBtn').classList.remove('recording'); };
  rec.onerror = e => {
    state.recording = false; $('#micBtn').classList.remove('recording');
    if (e.error === 'not-allowed') toast('ไม่ได้รับอนุญาตให้ใช้ไมโครโฟน', 'error');
  };
  state.recognition = rec; state.recording = true;
  $('#micBtn').classList.add('recording');
  rec.start();
  toast('กำลังฟัง… พูดได้เลย (กดอีกครั้งเพื่อหยุด)');
});

function renderModelMenu(){

  } else if (pub.active){
    const u = pub.usage;
    items.push({ id:'__cur', cur:true, name:'แชท AI',
      desc: !pub.modelReady ? 'เซิร์ฟเวอร์ยังไม่ได้ตั้งค่าโมเดล'
        : u ? 'โควตาวันนี้เหลือ ' + fmtNum(u.remaining) + ' จาก ' + fmtNum(u.limit) + ' โทเค็น · รีเซ็ต 00:00 UTC' : 'พร้อมใช้งาน' });
  } else {
    if (server.model) items.push({ id:'__cur', cur:true, name:server.model,
      desc: server.provider + (server.activeProfile ? ' · โปรไฟล์ ' + server.activeProfile : '') + (server.hasApiKey ? '' : ' · ยังไม่มี API key') });
    server.profiles.filter(p => p.name !== server.activeProfile).forEach(p =>
      items.push({ id:'p:' + p.name, name:p.name, desc:(p.model || '') + (p.apiStyle ? ' · ' + p.apiStyle : '') }));
  }
  if (!pub.active) items.push({ id:'__cfg', name:'ตั้งค่าโมเดล…', desc:'เปลี่ยนผู้ให้บริการ โมเดล และ API key' });
  if (authUser) items.push({ id:'__out', name:'ออกจากระบบ', desc: authUser.email || '' });
  const menu = $('#modelMenu');
  menu.innerHTML = items.map(m => `
    <button role="option" aria-selected="${!!m.cur}" data-id="${escapeHtml(m.id)}">
      <span class="m-name">${escapeHtml(m.name)} ${m.cur ? '<span class="check">✓</span>' : ''}</span>
      <span class="m-desc">${escapeHtml(m.desc)}</span>
    </button>`).join('');
  menu.querySelectorAll('button').forEach(b => b.addEventListener('click', async () => {
    $('#modelMenu').classList.add('hidden');
    $('#modelBtn').setAttribute('aria-expanded', 'false');

    if (id === '__out'){

      goLogin();
    } else if (id === '__cfg'){
      openSettings();
      setTimeout(() => { const r = [...document.querySelectorAll('.sp-row')].find(x => x.textContent.includes('โมเดล')); if (r) r.click(); }, 30);
    } else if (id.startsWith('p:')){
      try{
        await apiJson('/api/agent/profiles/activate', { method:'POST', body: JSON.stringify({ name: id.slice(2) }) });
        serverCtx.chatId = null;
        await loadServerInfo();
        toast('เปลี่ยนเป็นโปรไฟล์ ' + id.slice(2));
      }catch(e){ toast((e && e.message) || 'เปลี่ยนโปรไฟล์ไม่สำเร็จ', 'error'); }
    }
  }));
}

/* ==================== ส่งออกแชท (Markdown / JSON / TXT) ==================== */
function chatToMarkdown(chat){
  const lines = ['# ' + chat.title, '', '_ส่งออกเมื่อ ' + new Date().toLocaleString('th-TH') + '_', ''];
  chat.messages.forEach(m => {
    lines.push(m.role === 'user' ? '## 🧑 คุณ' : '## 🤖 AI');
    lines.push('', msgText(m), '');
  });
  return lines.join('\n');
}
function exportChat(chat, fmt){
  const safe = chat.title.replace(/[\\/:*?"<>|]/g, '_').slice(0, 60) || 'chat';
  if (fmt === 'json'){
    downloadFile(safe + '.json', JSON.stringify(chat, null, 2), 'application/json');
  } else if (fmt === 'txt'){
    const txt = chat.messages.map(m => (m.role === 'user' ? '[คุณ] ' : '[AI] ') + mdToPlain(msgText(m))).join('\n\n');
    downloadFile(safe + '.txt', chat.title + '\n\n' + txt);
  } else {
    downloadFile(safe + '.md', chatToMarkdown(chat), 'text/markdown');
  }
  toast('ส่งออกแชทแล้ว');
}
$('#exportBtn').addEventListener('click', e => {
  const chat = currentChat();
  if (!chat || !chat.messages.length){ toast('ยังไม่มีข้อความให้ส่งออก', 'error'); return; }
  closeMenus();
  const menu = document.createElement('div');
  menu.className = 'context-menu';
  menu.innerHTML = `
    <button data-fmt="md"><svg width="15" height="15"><use href="#i-doc"/></svg>Markdown (.md)</button>
    <button data-fmt="txt"><svg width="15" height="15"><use href="#i-doc"/></svg>ข้อความล้วน (.txt)</button>
    <button data-fmt="json"><svg width="15" height="15"><use href="#i-doc"/></svg>JSON (.json)</button>`;
  document.body.appendChild(menu);
  const r = e.currentTarget.getBoundingClientRect();
  menu.style.top = (r.bottom + 6) + 'px';
  menu.style.left = Math.max(8, r.right - 200) + 'px';
  openMenuEl = menu;
  menu.addEventListener('click', ev => {
    const fmt = ev.target.closest('button')?.dataset.fmt;
    if (fmt){ closeMenus(); exportChat(chat, fmt); }
  });
});

/* ==================== 10) MODAL พื้นฐาน / CONFIRM / SETTINGS ==================== */
function openModal(html, opts){
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = `<div class="modal ${opts?.small ? 'small' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(ov);
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey, true); };
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  const onKey = e => { if (e.key === 'Escape'){ e.stopPropagation(); close(); } };
  document.addEventListener('keydown', onKey, true);
  ov.querySelector('.modal').querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  /* โฟกัสอิลิเมนต์แรกเพื่อ a11y */
  setTimeout(() => ov.querySelector('button, input, textarea, select')?.focus(), 30);
  return { ov, close };
}

}

      <div class="switch-row" style="border-bottom:1px solid var(--border)">
        <span style="font-size:13.5px">${d}</span>
        <code style="font-family:var(--font-mono);font-size:12px;background:var(--code-bg);border:1px solid var(--border);padding:3px 9px;border-radius:7px">${k}</code>
      </div>`).join('')}
  </div>`, { small: true }));

document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'k'){ e.preventDefault(); $('#searchInput').focus(); }
  else if (mod && e.shiftKey && e.key.toLowerCase() === 'o'){ e.preventDefault(); createChat(); $('#input').focus(); }
  else if (mod && e.key.toLowerCase() === 'b'){ e.preventDefault(); toggleSidebar(); }
  else if (e.key === '/' && !e.target.closest('input, textarea, select')){
    e.preventDefault(); $('#input').focus();
  }
  else if (e.key === 'Escape'){
    /* ปิดเมนู / drawer / หยุดการตอบ (modal จัดการเอง) */
    closeMenus();
    $('#modelMenu').classList.add('hidden');
    closeMobileDrawer();
    if (state.generating) stopGeneration();
  }
});

/* ==================== 12) SIDEBAR พับ/ขยาย + drawer มือถือ ==================== */
const sidebarEl = $('#sidebar');
const isMobile = () => matchMedia('(max-width: 820px)').matches;
function toggleSidebar(){
  if (isMobile()){
    const open = sidebarEl.classList.toggle('open');
    $('#sidebarOverlay').classList.toggle('show', open);
  } else {
    state.settings.sidebarCollapsed = !state.settings.sidebarCollapsed;
    sidebarEl.classList.toggle('collapsed', state.settings.sidebarCollapsed);
    saveSettings();
  }
}
function closeMobileDrawer(){
  sidebarEl.classList.remove('open');
  $('#sidebarOverlay').classList.remove('show');
}
$('#sidebarToggle').addEventListener('click', toggleSidebar);
$('#mobileMenuBtn').addEventListener('click', toggleSidebar);
$('#sidebarOverlay').addEventListener('click', closeMobileDrawer);
$('#newChatBtn').addEventListener('click', () => { createChat(); closeMobileDrawer(); $('#input').focus(); });
$('#searchInput').addEventListener('input', e => renderChatList(e.target.value));

/* สลับปุ่มเมนูตามขนาดจอ */
function syncResponsive(){
  $('#mobileMenuBtn').classList.toggle('hidden', !isMobile());
  if (isMobile()){ sidebarEl.classList.remove('collapsed'); }
  else { sidebarEl.classList.toggle('collapsed', state.settings.sidebarCollapsed); closeMobileDrawer(); }
}
matchMedia('(max-width: 820px)').addEventListener('change', syncResponsive);

/* คัดลอกโค้ดจากปุ่มใน code block (event delegation) */
document.addEventListener('click', e => {
  const btn = e.target.closest('.code-copy');
  if (!btn) return;
  const code = decodeURIComponent(btn.dataset.code || '');
  copyText(code);
  btn.classList.add('copied');
  const span = btn.querySelector('span');
  const old = span.textContent;
  span.textContent = 'คัดลอกแล้ว ✓';
  setTimeout(() => { btn.classList.remove('copied'); span.textContent = old; }, 2000);
});

/* ==================== 13) INIT ==================== */
function init(){
  applyTheme(); applyFontSize();
  renderModelMenu();
  loadServerInfo().then(connectEvents);
  renderChatList();
  renderConversation();
  syncResponsive();
  $('#userName').textContent = state.settings.userName;
  $('#userAvatar').textContent = (state.settings.userName.replace(/^คุณ/, '')[0] || 'ค').toUpperCase();
  /* ถ้าแชทปัจจุบันหายไป (เช่น import ผิดพลาด) ให้รีเซ็ต */
  if (state.currentId && !getChat(state.currentId)) state.currentId = null;
  updateSendState();
  $('#input').focus();
}
