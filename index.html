<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iris - เข้าสู่ระบบ</title>
<style>
:root{--or:#ff7a1a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#000;color:#fff;font-family:-apple-system,"Sarabun","Noto Sans Thai",system-ui,sans-serif;display:flex;flex-direction:column;position:relative;overflow:hidden}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;position:relative;text-align:center;padding:0 20px}
.logo{position:relative;width:84px;height:84px}
.mandala{position:absolute;left:50%;top:50%;width:860px;height:860px;margin:-430px;pointer-events:none}
.ln{fill:none;stroke:var(--or);stroke-width:.9;stroke-linecap:round;stroke-linejoin:round}
.ln g{animation:spin 120s linear infinite}
.ln .r1{animation-duration:90s;animation-direction:reverse}
.ln .r3{animation-duration:80s;animation-direction:reverse}
.ln .r0,.ln .r4,.ln>g:last-child{animation-duration:150s}
.ln>g:last-child{animation:none}
.fly{position:relative;width:84px;height:84px;filter:drop-shadow(0 0 8px rgba(255,122,26,.8));animation:fl 4s ease-in-out infinite}
h1{position:relative;font-size:28px;font-weight:700;margin:0;text-shadow:0 0 8px #000,0 0 18px #000,0 0 28px #000}
h1 span{font-family:Georgia,"Times New Roman",serif;font-weight:600;color:var(--or)}
.actions{position:relative;width:100%;max-width:440px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;position:relative;height:54px;border-radius:18px;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,122,26,.65);color:#fff;font:inherit;font-size:16px;cursor:pointer;width:100%;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98);opacity:.85}
.btn svg{position:absolute;left:18px;width:22px;height:22px}
.or{display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.7);font-size:14px}
.or:before,.or:after{content:"";flex:1;height:1px;background:rgba(255,122,26,.5)}
.email{display:none;flex-direction:column;gap:10px}
.email.show{display:flex}
.email input{height:50px;border-radius:14px;border:1px solid rgba(255,122,26,.65);background:rgba(0,0,0,.62);color:#fff;padding:0 14px;font:inherit;font-size:16px;outline:none}
.email input::placeholder{color:rgba(255,255,255,.55)}
.foot{position:relative;text-align:center;color:rgba(255,255,255,.7);font-size:13px;line-height:1.7;padding:18px 20px 14px;text-shadow:0 0 8px #000}
.foot a{color:inherit;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translate(-50%,20px);background:var(--or);color:#000;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.wings{transform-origin:32px 32px;animation:flap 1.6s ease-in-out infinite}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.8)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// ===== ใส่ค่า Firebase web config ของคุณตรงนี้ =====
const firebaseConfig = {
  apiKey: "AIzaSyCFAPrGW9Et0JevTB61C_-admbGc7LnHYE",
  authDomain: "my-awesome-project-76358.firebaseapp.com",
  projectId: "my-awesome-project-76358",
  appId: "1:213268817641:web:0e2b1e8a046c34d86eb278"
};
// ================================================

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const btn = document.getElementById('gbtn');
const h1 = document.querySelector('h1');
const original = h1.innerHTML;

btn.addEventListener('click', async () => {
  if (auth.currentUser) { signOut(auth); return; }
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { t(e.code === 'auth/popup-closed-by-user' ? 'ยกเลิกการเข้าสู่ระบบ' : 'เข้าสู่ระบบไม่สำเร็จ: ' + e.code); }
});

onAuthStateChanged(auth, (u) => {
  if (u) {
    h1.textContent = 'สวัสดี ' + (u.displayName || u.email);
    btn.lastChild.textContent = 'ออกจากระบบ';
    // TODO: window.location.href = '/app';  // ไปหน้าหลักหลังล็อกอิน
  } else {
    h1.innerHTML = original;
    btn.lastChild.textContent = 'เข้าสู่ระบบด้วย Google';
  }
});
</script>
