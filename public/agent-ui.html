<!DOCTYPE html>
<!--
  ============================================================================
  AI Chatbot — หน้าเว็บแชทบอทแบบไฟล์เดียว (Single-file HTML)
  ----------------------------------------------------------------------------
  - Vanilla HTML/CSS/JS เปิดในเบราว์เซอร์ได้ทันที
  - โหมด Mock: จำลองคำตอบแบบสตรีม ทดสอบ UI ได้โดยไม่ต้องมี API
  - ต้องการเชื่อม API จริง ให้ดูฟังก์ชัน callChatAPI() ในส่วน JavaScript
  ============================================================================
-->
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover เพื่อรองรับ safe-area ของ iPhone (รอยบาก/ขอบล่าง) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="AI Chatbot — ผู้ช่วยสนทนาอัจฉริยะ">
<title>AI Chatbot</title>

<!-- ==================== ฟอนต์ (Google Fonts) ==================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Serif+Thai:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Prompt:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- ==================== ไลบรารีจาก CDN (cdnjs) ==================== -->
<!-- marked: แปลง Markdown -> HTML -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<!-- DOMPurify: sanitize HTML ป้องกัน XSS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
<!-- highlight.js: syntax highlighting สำหรับ code block -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" integrity="sha384-eFTL69TLRZTkNfYZOLM+G04821K1qZao/4QLJbet1pP4tcF+fdXq/9CdqAbWRl/L" crossorigin="anonymous" id="hljsLight">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" integrity="sha384-wH75j6z1lH97ZOpMOInqhgKzFkAInZPPSPlZpYKYTOqsaizPvhQZmAtLcPKXpLyH" crossorigin="anonymous" id="hljsDark" disabled>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>

<style>
/* ============================================================================
   1) CSS VARIABLES — โทนสีของทั้งสองธีม (แก้ที่นี่จุดเดียวเพื่อเปลี่ยนสีทั้งแอป)
   ============================================================================ */
:root{
  /* --- Light theme (ค่าเริ่มต้น) : โทนครีมอบอุ่น --- */
  --bg:            #faf9f5;  /* พื้นหลังหลัก */
  --bg-elevated:   #ffffff;  /* พื้นหลังการ์ด/modal */
  --sidebar-bg:    #f2f1ea;  /* พื้นหลัง sidebar */
  --hover:         rgba(31,30,29,.055);
  --active:        rgba(31,30,29,.09);
  --text:          #1f1e1d;
  --text-2:        #6e6a61;  /* ข้อความรอง */
  --text-3:        #a3a098;  /* ข้อความจาง */
  --border:        #e6e3d9;
  --border-strong: #d6d2c6;
  --accent:        #d97757;  /* ส้มดินเผา (จุดเด่นหลัก) */
  --accent-hover:  #c96443;
  --accent-soft:   rgba(217,119,87,.13);
  --on-accent:     #ffffff;
  --user-bubble:   #eae8df;  /* กล่องข้อความฝั่งผู้ใช้ */
  --code-bg:       #f6f5f0;
  --code-head-bg:  #ecebe3;
  --error:         #b83a2d;
  --error-bg:      #fdf1ef;
  --error-border:  #f0d3cd;
  --success:       #3f8455;
  --overlay:       rgba(31,30,29,.4);
  --shadow-sm:     0 1px 2px rgba(31,30,29,.06), 0 1px 6px rgba(31,30,29,.05);
  --shadow-md:     0 4px 16px rgba(31,30,29,.10), 0 1px 4px rgba(31,30,29,.08);
  --shadow-lg:     0 12px 40px rgba(31,30,29,.16);
  --ring:          rgba(217,119,87,.45); /* focus ring */
  /* ฟอนต์: ไทย + ละติน พร้อม fallback ของระบบ */
  --font-ui: 'Prompt','Noto Sans Thai',-apple-system,'Segoe UI',Tahoma,sans-serif;
 --font-display: 'Playfair Display','Noto Serif Thai',Georgia,serif;
 --font-read: 'Lora','Noto Serif Thai',Georgia,serif;
  --font-mono: 'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --font-size: 15.5px;       /* ขนาดตัวอักษรเนื้อความ (ปรับได้ใน Settings) */
  --radius: 12px;
  --sidebar-w: 260px;
  --content-w: 768px;
  --ease: cubic-bezier(.23,1,.32,1);
}
[data-theme="dark"]{
  /* --- Dark theme --- */
  --bg:            #262624;
  --bg-elevated:   #2f2e2c;
  --sidebar-bg:    #1f1e1d;
  --hover:         rgba(245,244,238,.06);
  --active:        rgba(245,244,238,.11);
  --text:          #f0efea;
  --text-2:        #b3aea4;
  --text-3:        #837f76;
  --border:        #3d3c39;
  --border-strong: #4c4a46;
  --accent:        #d97757;
  --accent-hover:  #e8896a;
  --accent-soft:   rgba(217,119,87,.18);
  --on-accent:     #ffffff;
  --user-bubble:   #3a3936;
  --code-bg:       #1e1d1b;
  --code-head-bg:  #2a2927;
  --error:         #ef7a6d;
  --error-bg:      #3a2725;
  --error-border:  #5c3631;
  --success:       #6fbf8a;
  --overlay:       rgba(0,0,0,.55);
  --shadow-sm:     0 1px 2px rgba(0,0,0,.25);
  --shadow-md:     0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:     0 12px 40px rgba(0,0,0,.5);
  --ring:          rgba(217,119,87,.55);
}

/* ============================================================================
   2) BASE / RESET
   ============================================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  font-family:var(--font-ui);
  font-size:var(--font-size);
  line-height:1.65;
  color:var(--text);
  background:var(--bg);
  /* 100dvh รองรับแถบ URL ของมือถือที่หด/ขยาย */
  height:100dvh;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
::selection{background:var(--accent-soft)}

/* focus ring ชัดเจนสำหรับการใช้งานด้วยคีย์บอร์ด (a11y) */
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:6px}

/* Scrollbar แบบกำหนดเอง บาง ๆ */
*{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px}
*::-webkit-scrollbar-track{background:transparent}

/* ============================================================================
   3) LAYOUT หลัก: sidebar + main
   ============================================================================ */
#app{display:flex;height:100dvh;width:100%}
.main{
  flex:1;min-width:0;display:flex;flex-direction:column;
  background:var(--bg);position:relative;
}

/* ============================================================================
   4) SIDEBAR
   ============================================================================ */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;height:100%;
  background:var(--sidebar-bg);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:width .22s var(--ease),transform .25s var(--ease);
  overflow:hidden;white-space:nowrap;
  /* safe-area ด้านซ้ายของ iPhone แนวนอน */
  padding-left:env(safe-area-inset-left);
}
.sidebar.collapsed{width:0;border-right:none}
.sidebar-inner{width:calc(var(--sidebar-w) - 1px);display:flex;flex-direction:column;height:100%;padding:10px 10px 0}

/* ปุ่มแชทใหม่ */
.new-chat-btn{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:9px 12px;border-radius:10px;
  border:1px solid var(--border-strong);background:var(--bg-elevated);
  font-weight:500;font-size:14px;
  box-shadow:var(--shadow-sm);
  transition:background .16s var(--ease),transform .16s var(--ease);
}
.new-chat-btn:hover{background:var(--hover)}
.new-chat-btn:active{transform:scale(.985)}
.new-chat-btn svg{color:var(--accent)}

/* ช่องค้นหาแชท */
.search-box{position:relative;margin:10px 0 4px}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.search-box input{
  width:100%;padding:7px 10px 7px 32px;border-radius:9px;
  border:1px solid var(--border);background:var(--bg);
  font-size:13.5px;outline:none;
  transition:border-color .15s;
}
.search-box input:focus{border-color:var(--accent)}
.search-box input::placeholder{color:var(--text-3)}

/* รายการแชท */
.chat-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 0 8px;margin:0 -4px}
.chat-group-label{
  font-size:11.5px;font-weight:600;color:var(--text-3);
  padding:14px 12px 5px;letter-spacing:.02em;user-select:none;
}
.chat-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;margin:1px 4px;border-radius:9px;
  cursor:pointer;position:relative;font-size:14px;
  transition:background .14s;
}
.chat-item:hover{background:var(--hover)}
.chat-item.active{background:var(--active)}
.chat-item .title{
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
}
.chat-item .pin-icon{color:var(--accent);flex-shrink:0}
/* ปุ่มเมนู "..." แสดงเมื่อ hover */
.chat-item .more-btn{
  opacity:0;flex-shrink:0;width:26px;height:26px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;color:var(--text-2);
  transition:opacity .14s,background .14s;
}
.chat-item:hover .more-btn,.chat-item .more-btn[aria-expanded="true"]{opacity:1}
.chat-item .more-btn:hover{background:var(--active);color:var(--text)}
/* inline rename input */
.chat-item .rename-input{
  flex:1;min-width:0;background:var(--bg-elevated);border:1px solid var(--accent);
  border-radius:6px;padding:2px 6px;font-size:14px;outline:none;
}

/* เมนู context ของรายการแชท */
.context-menu{
  position:fixed;z-index:200;min-width:180px;
  background:var(--bg-elevated);border:1px solid var(--border);
  border-radius:12px;box-shadow:var(--shadow-md);padding:5px;
  animation:pop-in .14s var(--ease);
}
.context-menu button{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:8px 10px;border-radius:8px;font-size:13.5px;text-align:left;
  transition:background .12s;
}
.context-menu button:hover{background:var(--hover)}
.context-menu button.danger{color:var(--error)}
.context-menu .sep{height:1px;background:var(--border);margin:4px 6px}

/* ส่วนล่างของ sidebar: โปรไฟล์ + ตั้งค่า */
.sidebar-footer{
  border-top:1px solid var(--border);padding:8px 4px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:6px;
}
.user-chip{
  display:flex;align-items:center;gap:10px;flex:1;min-width:0;
  padding:6px 8px;border-radius:10px;cursor:pointer;
  transition:background .14s;
}
.user-chip:hover{background:var(--hover)}
.avatar{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  background:var(--accent);color:var(--on-accent);
  display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:13px;user-select:none;
}
.user-chip .name{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:var(--text-2);
  transition:background .14s,color .14s;
}
.icon-btn:hover{background:var(--hover);color:var(--text)}

/* overlay สำหรับ drawer บนมือถือ */
.sidebar-overlay{
  display:none;position:fixed;inset:0;background:var(--overlay);
  z-index:150;opacity:0;transition:opacity .22s;
}
.sidebar-overlay.show{opacity:1}

/* ============================================================================
   5) HEADER (แถบด้านบนของพื้นที่แชท)
   ============================================================================ */
.topbar{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;min-height:56px;flex-shrink:0;
  padding-top:calc(10px + env(safe-area-inset-top));
}
.topbar .chat-title{
  font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;min-width:0;flex:1;
}
.topbar-spacer{flex:1}
/* ปุ่มเลือกโมเดล */
.model-select-wrap{position:relative}
.model-btn{
  display:flex;align-items:center;gap:6px;
  padding:6px 11px;border-radius:9px;font-size:13.5px;font-weight:500;
  color:var(--text-2);transition:background .14s;
}
.model-btn:hover{background:var(--hover)}
.model-menu{
  position:absolute;top:calc(100% + 6px);right:0;z-index:120;
  min-width:230px;background:var(--bg-elevated);
  border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--shadow-md);padding:5px;
  animation:pop-in .14s var(--ease);
}
.model-menu button{
  display:flex;flex-direction:column;gap:1px;width:100%;
  padding:8px 11px;border-radius:8px;text-align:left;
  transition:background .12s;
}
.model-menu button:hover{background:var(--hover)}
.model-menu .m-name{font-size:13.5px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.model-menu .m-desc{font-size:12px;color:var(--text-3)}
.model-menu .check{color:var(--accent);font-weight:700}
</style>
<style>
/* ============================================================================
   6) พื้นที่แชท + EMPTY STATE
   ============================================================================ */
.chat-scroll{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.chat-container{
  max-width:var(--content-w);margin:0 auto;
  padding:12px 20px 24px;width:100%;
}

/* --- หน้าจอเริ่มต้น --- */
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:calc(100dvh - 240px);text-align:center;padding:20px 0 8px;
  animation:msg-in .35s var(--ease);
}
.bot-logo{
  width:56px;height:56px;border-radius:18px;margin-bottom:18px;
  background:var(--accent);color:var(--on-accent);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm);
}
.empty-state h1{font-size:24px;font-weight:600;margin-bottom:22px;letter-spacing:-.01em}
.suggestion-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;width:100%;max-width:640px;
}
.suggestion-card{
  text-align:left;padding:13px 15px;border-radius:var(--radius);
  border:1px solid var(--border);background:var(--bg-elevated);
  transition:border-color .16s,background .16s,transform .16s var(--ease);
  box-shadow:var(--shadow-sm);
}
.suggestion-card:hover{border-color:var(--border-strong);background:var(--hover);transform:translateY(-1px)}
.suggestion-card .s-title{font-size:14px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:8px}
.suggestion-card .s-title svg{color:var(--accent);flex-shrink:0}
.suggestion-card .s-sub{font-size:12.5px;color:var(--text-2)}

/* ============================================================================
   7) ข้อความ (MESSAGE)
   ============================================================================ */
.msg{display:flex;gap:12px;padding:18px 0;animation:msg-in .3s var(--ease)}
.msg-avatar{
  width:30px;height:30px;border-radius:9px;flex-shrink:0;margin-top:2px;
  background:var(--accent);color:var(--on-accent);
  display:flex;align-items:center;justify-content:center;
}
.msg-body{flex:1;min-width:0}
/* ข้อความผู้ใช้: ชิดขวาเป็นกล่องมน */
.msg.user{flex-direction:row-reverse}
.msg.user .msg-body{display:flex;flex-direction:column;align-items:flex-end}
.user-bubble{
  background:var(--user-bubble);border-radius:18px;
  padding:9px 15px;max-width:85%;
  white-space:pre-wrap;word-break:break-word;
}
/* เวลา (แสดงเมื่อ hover) */
.msg-time{
  font-size:11px;color:var(--text-3);margin-top:4px;
  opacity:0;transition:opacity .15s;user-select:none;
}
.msg:hover .msg-time{opacity:1}

/* เนื้อหา Markdown ของบอท */
.md{word-break:break-word;font-size:var(--font-size)}
.md>*:first-child{margin-top:0}
.md>*:last-child{margin-bottom:0}
.md p{margin:.55em 0}
.md h1,.md h2,.md h3,.md h4{line-height:1.35;margin:1em 0 .45em;font-weight:600}
.md h1{font-size:1.45em}.md h2{font-size:1.25em}.md h3{font-size:1.1em}.md h4{font-size:1em}
.md ul,.md ol{margin:.55em 0;padding-left:1.5em}
.md li{margin:.25em 0}
.md li::marker{color:var(--text-2)}
.md blockquote{
  border-left:3px solid var(--border-strong);padding:.2em 0 .2em 14px;
  margin:.7em 0;color:var(--text-2);
}
.md hr{border:none;border-top:1px solid var(--border);margin:1.1em 0}
.md a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.md code:not(pre code){
  font-family:var(--font-mono);font-size:.86em;
  background:var(--code-bg);border:1px solid var(--border);
  padding:.12em .4em;border-radius:6px;
}
.md table{border-collapse:collapse;margin:.8em 0;width:100%;font-size:.93em;display:block;overflow-x:auto}
.md table table{display:table;width:100%}
.md th,.md td{border:1px solid var(--border);padding:7px 12px;text-align:left}
.md th{background:var(--code-bg);font-weight:600}
.md .katex{font-size:1.02em}
.md .katex-display{margin:.8em 0;overflow-x:auto;padding:2px 0}

/* --- Code block พร้อม header ชื่อภาษา + ปุ่มคัดลอก --- */
.code-block{
  margin:.8em 0;border-radius:12px;overflow:hidden;
  border:1px solid var(--border);background:var(--code-bg);
}
.code-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 8px 6px 14px;background:var(--code-head-bg);
  font-size:12px;color:var(--text-2);font-family:var(--font-mono);
}
.code-copy{
  display:flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:7px;font-size:12px;color:var(--text-2);
  font-family:var(--font-ui);transition:background .13s,color .13s;
}
.code-copy:hover{background:var(--hover);color:var(--text)}
.code-copy.copied{color:var(--success)}
.code-block pre{margin:0;padding:13px 15px;overflow-x:auto}
.code-block pre code{
  font-family:var(--font-mono);font-size:13px;line-height:1.6;
  background:transparent;border:none;padding:0;
}

/* เคอร์เซอร์กะพริบระหว่างสตรีม */
.streaming-cursor::after{
  content:'▍';color:var(--accent);margin-left:1px;
  animation:blink 1s steps(1) infinite;
}

.as-tiles{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.as-tiles::-webkit-scrollbar{display:none}
.as-tile{flex:0 0 94px;height:94px;border-radius:24px;background:var(--bg-sunken,rgba(127,127,127,.12));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;font-size:13px;color:var(--text);transition:.18s}
.as-tile:hover{transform:translateY(-2px)}.as-tile:active{transform:scale(.96)}
.as svg{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.as-tile svg{width:26px;height:26px}
.as-row{display:flex;align-items:center;gap:16px;width:100%;padding:16px 8px;text-align:left}
.as-row>svg{width:24px;height:24px}.as-row .tx{flex:1;min-width:0}.as-row b{display:block;font-weight:500;font-size:16.5px}
.as-row small{display:block;font-size:13.5px;color:var(--text-3);margin-top:2px;white-space:normal}
.as-row .val{color:var(--text-3);font-size:14.5px}.as-row .go{width:18px;height:18px;color:var(--text-3)}
.as-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}.as-head h3{font-family:var(--font-display);font-size:19px;margin:0}
.as-head button{width:36px;height:36px;display:grid;place-items:center}.as-head svg{width:22px;height:22px}
.as-pr{display:block;width:100%;text-align:left;padding:14px 8px;border-top:1px solid var(--border);font-size:15px}.as-pr:first-of-type{border:0}
.as-pr b{display:block;font-weight:500}.as-pr small{color:var(--text-3);font-size:13px}
@keyframes asUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}@keyframes asFade{from{opacity:0}to{opacity:1}}

/* ===== หน้าโหลด: โน้ต 12 แบบสลับนุ่มๆ + วงแหวน + แสงเรือง ===== */
#ld{--T:4.2s;position:fixed;inset:0;z-index:9999;background:var(--bg,#111);display:grid;place-items:center;opacity:1;overflow:hidden}
#ld.off{opacity:0;visibility:hidden;pointer-events:none}
#ld .ld-in{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--text,#eee);}
#ld .ld-glow{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(closest-side,var(--text,#fff),transparent);opacity:.07;}
#ld svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
#ld .f{fill:currentColor}#ld .o{fill:none}
#ld .ring{stroke-width:.6;opacity:.4;stroke-dasharray:1.5 3.5;transform-origin:24px 24px;}
#ld .staff{stroke-width:.5;opacity:.18}
#ld .nf{opacity:0;transform-box:fill-box;transform-origin:center;}
#ld .sp2{stroke-width:1.4;;transform-box:fill-box;transform-origin:center}
#ld .ld-n{position:relative;height:22px;width:50px;font-family:var(--font-display,serif);font-size:15px;letter-spacing:.14em;color:var(--text-3,#999);text-align:center}
#ld .ld-n span{position:absolute;inset:0;opacity:0;}
@keyframes ldn{0%{opacity:0;transform:translateY(9px) scale(.82) rotate(-6deg);filter:blur(3px)}2.4%{opacity:1;transform:none;filter:blur(0)}6%{opacity:1;transform:none;filter:blur(0)}8.333%{opacity:0;transform:translateY(-9px) scale(1.12) rotate(6deg);filter:blur(3px)}8.4%,100%{opacity:0}}
@keyframes ldl{0%{opacity:0;transform:translateY(4px)}2.4%,6%{opacity:1;transform:none}8.333%{opacity:0;transform:translateY(-4px)}8.4%,100%{opacity:0}}
@keyframes ldt{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.2);opacity:1}}
@keyframes ldr{to{transform:rotate(360deg)}}@keyframes ldg{0%,100%{transform:scale(.9);opacity:.05}50%{transform:scale(1.1);opacity:.1}}
@keyframes ldin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

/* ===== หน้าเริ่มต้น: ทักทายสั้นๆ ตัวเล็ก ฟอนต์หรู ===== */
.empty-state{min-height:55vh;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.empty-state h1{font-family:var(--font-display);font-size:22px;font-weight:400;letter-spacing:.08em;color:var(--text-2);margin:0;text-align:center}
.empty-state h1::before{content:"";display:block;width:28px;height:1px;background:var(--text-3);opacity:.6;margin:0 auto 16px}
.hands-art{width:132px;height:auto;color:var(--text);margin-bottom:18px;overflow:visible}
.empty-state h1::before{display:none}

/* ===== ลายเส้นต้นกล้าในมือ ใช้ซ้ำทั้งแอป ===== */
.msg-avatar{background:transparent!important;color:var(--text)!important;border:1px solid var(--border);border-radius:50%!important}
.msg-avatar svg{stroke-width:1.5}
.error-box strong{font-family:var(--font-display);letter-spacing:.02em}
.chat-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 20px;color:var(--text-3)}
.chat-empty .hands-art{width:96px;margin-bottom:14px;color:var(--text-2);opacity:.85}
.chat-empty p{margin:0;font-family:var(--font-display);font-size:17px;color:var(--text-2);letter-spacing:.05em}
.chat-empty small{margin-top:4px;font-size:13px}
/* ===== ความคืบหน้าของเอเจนต์ (SSE) + ชิปเครื่องมือที่ใช้ ===== */
.live-activity{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-family:var(--font-mono);font-size:12px;color:var(--text-3)}
.live-activity:empty{display:none}
.tool-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.tool-chip{font-family:var(--font-mono);font-size:11.5px;color:var(--text-2);border:1px solid var(--border);border-radius:999px;padding:2px 9px}
.tool-chip.fail{color:var(--error);border-color:var(--error-border)}

<script>
(function(){
var ld=document.getElementById('ld'),t=0,t0=Date.now(),T=4200,fade=null,loops=[];
function A(el,kf,o){try{var a=el.animate(kf,o);loops.push(a);return a}catch(e){}}
/* โน้ต 12 แบบสลับกัน: เข้า(ลอยขึ้น+ชัดขึ้น) ค้าง ออก(ลอยขึ้น+จาง) */
var fr=ld.querySelectorAll('.nf'),lb=ld.querySelectorAll('.ld-n span');
var kf=[{opacity:0,transform:'translateY(9px) scale(.82) rotate(-6deg)',filter:'blur(3px)',offset:0,easing:'cubic-bezier(.2,.8,.2,1)'},
{opacity:1,transform:'none',filter:'blur(0px)',offset:.03},{opacity:1,transform:'none',filter:'blur(0px)',offset:.055,easing:'ease-in'},
{opacity:0,transform:'translateY(-9px) scale(1.12) rotate(6deg)',filter:'blur(3px)',offset:.0833},{opacity:0,offset:1}];
var kl=[{opacity:0,transform:'translateY(4px)',offset:0},{opacity:1,transform:'none',offset:.03},{opacity:1,transform:'none',offset:.055},{opacity:0,transform:'translateY(-4px)',offset:.0833},{opacity:0,offset:1}];
fr.forEach(function(el,i){A(el,kf,{duration:T,iterations:Infinity,delay:T/12*i})});
lb.forEach(function(el,i){A(el,kl,{duration:T,iterations:Infinity,delay:T/12*i})});
A(ld.querySelector('.ring'),[{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}],{duration:14000,iterations:Infinity});
A(ld.querySelector('.ld-glow'),[{transform:'scale(.9)',opacity:.05},{transform:'scale(1.1)',opacity:.1},{transform:'scale(.9)',opacity:.05}],{duration:3000,iterations:Infinity,easing:'ease-in-out'});
ld.querySelectorAll('.sp2').forEach(function(el){A(el,[{transform:'scale(.6)',opacity:.4},{transform:'scale(1.2)',opacity:1},{transform:'scale(.6)',opacity:.4}],{duration:1200,iterations:Infinity,easing:'ease-in-out'})});
A(ld.querySelector('.ld-in'),[{opacity:0,transform:'scale(.94)'},{opacity:1,transform:'none'}],{duration:800,easing:'cubic-bezier(.2,.8,.2,1)'});
/* จางออกแบบขยายนิดๆ + เบลอ แล้วซ่อน */
function hide(){if(ld.classList.contains('off')||fade)return;
  var inn=ld.querySelector('.ld-in');
  try{inn.animate([{transform:'none',filter:'blur(0px)'},{transform:'scale(1.07)',filter:'blur(5px)'}],{duration:850,easing:'ease',fill:'forwards'})}catch(e){}
  try{fade=ld.animate([{opacity:1},{opacity:0}],{duration:850,easing:'ease',fill:'forwards'});fade.onfinish=function(){ld.classList.add('off');fade.cancel();fade=null;inn.getAnimations().forEach(function(a){if(a.fill==='forwards')a.cancel()})}}
  catch(e){ld.classList.add('off')}}

  ld.querySelector('.ld-in').getAnimations().forEach(function(a){if(a.fill==='forwards')a.cancel()});

setTimeout(hide,6000);
})();
</script>

<script>
'use strict';
/* ============================================================================
   AI Chatbot — JavaScript หลัก (vanilla, แบ่งเป็นส่วน ๆ)
   สารบัญ:
     1. Storage (localStorage + fallback เป็นหน่วยความจำ)
     2. Config & State
     3. Utils ทั่วไป
     4. Toast / Theme
     5. Markdown render pipeline (+ sanitize + highlight + KaTeX)
     6. จัดการแชท (CRUD, จัดกลุ่มวันที่, ตั้งชื่ออัตโนมัติ)
     7. เรนเดอร์ข้อความ & ปุ่มการทำงาน
     8. callChatAPI — จุดเดียวสำหรับเชื่อม API จริง + โหมด Mock
     9. Composer (ส่ง/หยุด, แนบไฟล์, ไมค์, IME)
    10. Settings / นำเข้า-ส่งออก / แป้นพิมพ์ลัด
   ============================================================================ */

/* ==================== 1) STORAGE — localStorage พร้อม fallback ==================== */
const store = (() => {
  let mem = {};          // fallback: ตัวแปรในหน่วยความจำ
  let ok = false;
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); ok = true; }
  catch(e) { /* สภาพแวดล้อมไม่รองรับ localStorage */ }
  return {
    get(key, fallback){
      try{
        const raw = ok ? localStorage.getItem(key) : mem[key];
        return raw == null ? fallback : JSON.parse(raw);
      }catch(e){ return fallback; }
    },
    set(key, val){
      const s = JSON.stringify(val);
      if (ok){ try{ localStorage.setItem(key, s); return; }catch(e){} }
      mem[key] = s;
    },
    remove(key){ if(ok){ try{localStorage.removeItem(key);}catch(e){} } delete mem[key]; }
  };
})();

/* ==================== 2) CONFIG & STATE ==================== */
/* ข้อมูลเซิร์ฟเวอร์เอเจนต์ (ดึงจาก /api/agent/settings) */
const server = { online: null, provider: 'anthropic', model: '', baseUrl: '', hasApiKey: false, thinkingLevel: 'off', activeProfile: '', profiles: [] };
/* Public chat mode: a signed-in visitor outside the agent's allow-list uses /api/chat (no tools, history kept on the server). */
const pub = { active: false, usage: null, modelReady: false };
const fmtNum = n => Number(n || 0).toLocaleString('en-US');

const DEFAULT_SETTINGS = {
  theme: 'system',           // light | dark | system
  fontSize: 'medium',        // small | medium | large
  language: 'th',
  enterToSend: true,         // Enter = ส่ง, Shift+Enter = บรรทัดใหม่
  mockMode: location.protocol === 'file:',  // เปิดไฟล์ตรง ๆ = ไม่มีเซิร์ฟเวอร์ → โหมดจำลอง
  serverToken: '',           // ใช้เมื่อเซิร์ฟเวอร์ตั้ง AGENT_SERVER_API_KEY
  userName: 'คุณผู้ใช้',
  sidebarCollapsed: false,
};

const state = {
  chats: store.get('ai-chats', []),          // [{id,title,pinned,createdAt,updatedAt,messages[]}]
  settings: Object.assign({}, DEFAULT_SETTINGS, store.get('ai-settings', {})),
  currentId: store.get('ai-current', null),
  generating: false,       // บอทกำลังตอบอยู่หรือไม่
  abortCtrl: null,         // AbortController สำหรับปุ่มหยุด
  attachments: [],         // ไฟล์แนบที่รอส่ง [{name,type,size,dataUrl,text}]
  recognition: null,       // ตัวอ่านเสียงพูด (SpeechRecognition)
  recording: false,
};

const saveChats    = () => { if (!pub.active) store.set('ai-chats', state.chats); };
const saveSettings = () => store.set('ai-settings', state.settings);
/* รุ่นเก่าเก็บ API key/พารามิเตอร์โมเดลไว้ในเบราว์เซอร์ — ตอนนี้อยู่ที่เซิร์ฟเวอร์ทั้งหมด จึงล้างทิ้ง */
['apiKey','baseUrl','model','systemPrompt','temperature','maxTokens','streaming'].forEach(k => { delete state.settings[k]; });
saveSettings();
const $  = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

/* ==================== 3) UTILS ==================== */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function fmtTime(ts){
  return new Date(ts).toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
}
function fmtBytes(n){
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}
/* ประมาณการจำนวนโทเค็น (คร่าว ๆ: ~4 ตัวอักษร/โทเค็น) */
const estTokens = text => text.length ? Math.max(1, Math.ceil(text.length / 4)) : 0;

function copyText(text, okMsg){
  const done = () => toast(okMsg || 'คัดลอกแล้ว');
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => legacyCopy(text, done));
  } else legacyCopy(text, done);
}
function legacyCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('คัดลอกไม่สำเร็จ', 'error'); }
  ta.remove();
}
function downloadFile(name, content, mime){
  const blob = new Blob([content], {type: mime || 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ==================== 4) TOAST / THEME ==================== */
function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'error' ? ' error' : '');
  el.textContent = msg;
  $('#toastWrap').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 220); }, 2600);
}

/* ใช้ธีมตามค่า settings.theme (system = ตาม OS) */
const mql = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  const t = state.settings.theme;
  const dark = t === 'dark' || (t === 'system' && mql.matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  /* สลับสไตล์ชีตของ highlight.js ให้ตรงธีม */
  const l = $('#hljsLight'), d = $('#hljsDark');
  if (l && d){ l.disabled = dark; d.disabled = !dark; }
}
mql.addEventListener && mql.addEventListener('change', applyTheme);

function applyFontSize(){
  const map = { small:'14px', medium:'15.5px', large:'17px' };
  document.documentElement.style.setProperty('--font-size', map[state.settings.fontSize] || map.medium);
}

/* ==================== 5) MARKDOWN PIPELINE ==================== */
/* ขั้นตอน: ดักสูตรคณิต -> marked -> DOMPurify -> highlight.js -> แทนสูตรด้วย KaTeX
   ถ้า CDN โหลดไม่ได้ (ออฟไลน์) จะใช้ตัวแปลง Markdown แบบย่อที่เขียนเองด้านล่าง */

let mathStore = [];   // เก็บสูตรชั่วคราวระหว่างแปลง Markdown

function extractMath(text){
  mathStore = [];
  return text
    /* $$...$$ = display math */
    .replace(/\$\$([\s\S]+?)\$\$/g, (_, f) => { mathStore.push({f, d:true});  return `@@MATH${mathStore.length-1}@@`; })
    /* $...$ = inline math (ไม่กินข้ามบรรทัด) */
    .replace(/\$([^$\n]+?)\$/g,  (_, f) => { mathStore.push({f, d:false}); return `@@MATH${mathStore.length-1}@@`; });
}
function restoreMath(container){
  /* เดินหา text node ที่มี token แล้วแทนด้วยผลเรนเดอร์ของ KaTeX */
  if (!window.katex) return;
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()){ if (/@@MATH\d+@@/.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode); }
  nodes.forEach(node => {
    const frag = document.createDocumentFragment();
    node.nodeValue.split(/(@@MATH\d+@@)/).forEach(part => {
      const m = part.match(/^@@MATH(\d+)@@$/);
      if (m){
        const item = mathStore[+m[1]];
        const span = document.createElement(item.d ? 'div' : 'span');
        try{ span.innerHTML = katex.renderToString(item.f, {displayMode:item.d, throwOnError:false}); }
        catch(e){ span.textContent = part; }
        frag.appendChild(span);
      } else if (part){
        frag.appendChild(document.createTextNode(part));
      }
    });
    node.parentNode.replaceChild(frag, node);
  });
}

/* ตั้งค่า marked: code block มี header ชื่อภาษา + ปุ่มคัดลอก */
if (window.marked){
  marked.setOptions({ breaks:true, gfm:true });
  marked.use({
    renderer:{
      code(code, lang){
        const language = (lang || 'text').split(' ')[0];
        const raw = typeof code === 'string' ? code : code.text;
        return `<div class="code-block"><div class="code-head"><span>${escapeHtml(language)}</span>` +
          `<button class="code-copy" data-code="${escapeHtml(encodeURIComponent(raw))}" type="button">` +
          `<svg width="13" height="13" aria-hidden="true"><use href="#i-copy"/></svg><span>คัดลอก</span></button></div>` +
          `<pre><code class="hljs language-${escapeHtml(language)}">${escapeHtml(raw)}</code></pre></div>`;
      },
      link(href, title, text){
        return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${text}</a>`;
      }
    }
  });
}

/* ตัวแปลง Markdown แบบย่อ — ใช้เฉพาะตอน CDN โหลดไม่ได้ */
function miniMarkdown(src){
  let s = escapeHtml(src);
  s = s.replace(/```(\w*)\n([\s\S]*?)```/g, (_, l, c) =>
    `<div class="code-block"><div class="code-head"><span>${l || 'text'}</span></div><pre><code>${c}</code></pre></div>`);
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/^###### (.*)$/gm, '<h4>$1</h4>').replace(/^### (.*)$/gm, '<h3>$1</h3>')
       .replace(/^## (.*)$/gm, '<h2>$1</h2>').replace(/^# (.*)$/gm, '<h1>$1</h1>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  s = s.replace(/^> (.*)$/gm, '<blockquote>$1</blockquote>');
  s = s.replace(/^---+$/gm, '<hr>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.replace(/((?:^[ \t]*[-*] .*(?:\n|$))+)/gm, block =>
    '<ul>' + block.trim().split('\n').map(li => '<li>' + li.replace(/^[ \t]*[-*] /, '') + '</li>').join('') + '</ul>');
  s = s.replace(/\n{2,}/g, '</p><p>').replace(/\n/g, '<br>');
  return '<p>' + s + '</p>';
}

/* แปลง Markdown -> HTML ที่ปลอดภัย (กัน XSS ด้วย DOMPurify) */
function renderMarkdown(text){
  const prepared = extractMath(text);
  let html;
  if (window.marked) html = marked.parse(prepared);
  else html = miniMarkdown(prepared);
  if (window.DOMPurify){
    html = DOMPurify.sanitize(html, {
      ADD_ATTR: ['target','rel','data-code','type'],
      FORBID_TAGS: ['style','form','input','script','iframe','object','embed'],
    });
  }
  return html;
}

/* แทรก HTML ที่ sanitize แล้วลงใน element พร้อม highlight โค้ดและเรนเดอร์สูตร */
function mountMarkdown(el, text){
  el.innerHTML = renderMarkdown(text);
  restoreMath(el);
  if (window.hljs){
    el.querySelectorAll('pre code').forEach(c => {
      try{ hljs.highlightElement(c); }catch(e){}
    });
  }
}

/* แปลง Markdown -> ข้อความล้วน (ใช้กับคัดลอก/อ่านออกเสียง) */
function mdToPlain(text){
  const div = document.createElement('div');
  div.innerHTML = renderMarkdown(text);
  return div.textContent || '';
}
</script>
<script>
/* ==================== 6) จัดการแชท (CRUD) ==================== */
const getChat = id => state.chats.find(c => c.id === id);
const currentChat = () => getChat(state.currentId);

function createChat(){
  if (pub.active){
    const draft = state.chats.find(c => !c.remote && !c.messages.length);
    if (draft){ state.currentId = draft.id; renderChatList(); renderConversation(); return draft; }
  }
  const chat = { id: uid(), title: 'แชทใหม่', pinned:false, createdAt: Date.now(), updatedAt: Date.now(), messages: [] };
  state.chats.unshift(chat);
  state.currentId = chat.id;
  store.set('ai-current', chat.id);
  saveChats();
  renderChatList(); renderConversation();
  return chat;
}
function selectChat(id){
  if (state.generating) stopGeneration();
  state.currentId = id;
  store.set('ai-current', id);
  renderChatList(); renderConversation();
  closeMobileDrawer();
  if (pub.active) loadPublicMessages(getChat(id));
}
async function deleteChat(id){
  let idx = state.chats.findIndex(c => c.id === id);
  if (idx === -1) return;
  if (pub.active && state.chats[idx].remote){
    try{
      const r = await apiFetch('/api/chat/chats/' + encodeURIComponent(id), { method:'DELETE' });
      if (!r.ok && r.status !== 404){ if (fb) authFailure(r.status); toast('ลบแชทไม่สำเร็จ ลองใหม่อีกครั้ง', 'error'); return; }
    }catch(e){ toast((e && e.message) || 'ลบแชทไม่สำเร็จ', 'error'); return; }
    idx = state.chats.findIndex(c => c.id === id);
    if (idx === -1) return;
  }
  state.chats.splice(idx, 1);
  if (state.currentId === id){
    state.currentId = state.chats[0] ? state.chats[0].id : null;
    store.set('ai-current', state.currentId);
  }
  saveChats();
  renderChatList(); renderConversation();
  toast('ลบแชทแล้ว');
}
/* ตั้งชื่อแชทอัตโนมัติจากข้อความแรก (ตัดไม่เกิน 40 ตัวอักษร) */
function autoTitle(chat, firstText){
  let t = firstText.replace(/\s+/g, ' ').trim();
  if (t.length > 40) t = t.slice(0, 40).trim() + '…';
  chat.title = t || 'แชทใหม่';
  $('#chatTitle').textContent = chat.title;
}

/* --- จัดกลุ่มรายการแชทตามวัน --- */
function groupLabel(ts){
  const d = new Date(ts), now = new Date();
  const startOfDay = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diffDays = Math.round((startOfDay(now) - startOfDay(d)) / 86400000);
  if (diffDays <= 0) return 'วันนี้';
  if (diffDays === 1) return 'เมื่อวาน';
  if (diffDays <= 7) return '7 วันที่ผ่านมา';
  return 'เก่ากว่า';
}
const GROUP_ORDER = ['ปักหมุด', 'วันนี้', 'เมื่อวาน', '7 วันที่ผ่านมา', 'เก่ากว่า'];

function renderChatList(filter){
  const list = $('#chatList');
  list.innerHTML = '';
  const q = (filter ?? $('#searchInput').value).trim().toLowerCase();
  const chats = state.chats
    .filter(c => !q || c.title.toLowerCase().includes(q) ||
      c.messages.some(m => (m.text || lastVersion(m)?.text || '').toLowerCase().includes(q)))
    .slice()
    .sort((a, b) => b.updatedAt - a.updatedAt);

  const groups = {};
  chats.forEach(c => {
    const g = c.pinned ? 'ปักหมุด' : groupLabel(c.updatedAt);
    (groups[g] = groups[g] || []).push(c);
  });

  let any = false;
  GROUP_ORDER.forEach(g => {
    if (!groups[g] || !groups[g].length) return;
    any = true;
    const label = document.createElement('div');
    label.className = 'chat-group-label'; label.textContent = g;
    list.appendChild(label);
    groups[g].forEach(c => list.appendChild(chatItemEl(c)));
  });
  if (!any){
    const empty = document.createElement('div');
    empty.className = 'chat-empty';
    empty.innerHTML = HANDS_ART + '<p>' + (q ? 'ไม่พบแชทที่ค้นหา' : 'ยังไม่มีแชท') + '</p><small>' + (q ? 'ลองใช้คำอื่นดูนะ' : 'กดปุ่มด้านล่างเพื่อเริ่มคุยครั้งแรก') + '</small>';
    list.appendChild(empty);
  }
}

function chatItemEl(chat){
  const item = document.createElement('div');
  item.className = 'chat-item' + (chat.id === state.currentId ? ' active' : '');
  item.setAttribute('role', 'button');
  item.tabIndex = 0;
  item.dataset.id = chat.id;
  item.innerHTML =
    (chat.pinned ? '<svg class="pin-icon" width="13" height="13" aria-hidden="true"><use href="#i-pin"/></svg>' : '') +
    `<span class="title">${escapeHtml(chat.title)}</span>` +
    `<button class="more-btn" aria-label="เมนูแชท" aria-haspopup="menu" aria-expanded="false">
       <svg width="16" height="16" aria-hidden="true"><use href="#i-dots"/></svg>
     </button>`;
  const open = () => selectChat(chat.id);
  item.addEventListener('click', e => {
    if (e.target.closest('.more-btn') || e.target.closest('.rename-input')) return;
    open();
  });
  item.addEventListener('keydown', e => { if (e.key === 'Enter') open(); });
  item.querySelector('.more-btn').addEventListener('click', e => {
    e.stopPropagation();
    openChatMenu(e.currentTarget, chat);
  });
  return item;
}

/* --- เมนู "..." ของรายการแชท --- */
let openMenuEl = null;
function closeMenus(){ if (openMenuEl){ openMenuEl.remove(); openMenuEl = null; } $$('.more-btn[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false')); }
document.addEventListener('click', e => { if (openMenuEl && !e.target.closest('.context-menu')) closeMenus(); });

function openChatMenu(btn, chat){
  closeMenus();
  btn.setAttribute('aria-expanded', 'true');
  const menu = document.createElement('div');
  menu.className = 'context-menu';
  menu.setAttribute('role', 'menu');
  menu.innerHTML = `
    <button data-act="rename"><svg width="15" height="15"><use href="#i-edit"/></svg>เปลี่ยนชื่อ</button>
    <button data-act="pin"><svg width="15" height="15"><use href="#i-pin"/></svg>${chat.pinned ? 'เลิกปักหมุด' : 'ปักหมุด'}</button>
    <button data-act="export"><svg width="15" height="15"><use href="#i-export"/></svg>ส่งออก (Markdown)</button>
    <div class="sep"></div>
    <button data-act="delete" class="danger"><svg width="15" height="15"><use href="#i-trash"/></svg>ลบแชท</button>`;
  document.body.appendChild(menu);
  /* วางตำแหน่งเมนูไม่ให้ล้นจอ */
  const r = btn.getBoundingClientRect();
  menu.style.top = Math.min(r.bottom + 4, innerHeight - 190) + 'px';
  menu.style.left = Math.min(r.left - 120, innerWidth - 200) + 'px';
  openMenuEl = menu;

  menu.addEventListener('click', e => {
    const act = e.target.closest('button')?.dataset.act;
    if (!act) return;
    closeMenus();
    if (act === 'rename') startRename(chat);
    if (act === 'pin'){ chat.pinned = !chat.pinned; saveChats(); renderChatList(); }
    if (act === 'export') exportChat(chat, 'md');
    if (act === 'delete') confirmDialog(
      'ลบแชทนี้?', `แชท "${chat.title}" จะถูกลบถาวร ไม่สามารถกู้คืนได้`, 'ลบ',
      () => deleteChat(chat.id));
  });
}

/* เปลี่ยนชื่อแชทแบบ inline */
function startRename(chat){
  renderChatList();
  const item = $(`.chat-item[data-id="${chat.id}"]`);
  if (!item) return;
  const titleEl = item.querySelector('.title');
  const input = document.createElement('input');
  input.className = 'rename-input'; input.value = chat.title; input.maxLength = 80;
  input.setAttribute('aria-label', 'ชื่อแชทใหม่');
  titleEl.replaceWith(input);
  input.focus(); input.select();
  const commit = () => {
    const v = input.value.trim();
    if (v){ chat.title = v; saveChats(); if (chat.id === state.currentId) $('#chatTitle').textContent = v; }
    renderChatList();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); input.blur(); }
    if (e.key === 'Escape'){ input.value = chat.title; input.blur(); }
  });
}

/* ==================== 7) เรนเดอร์ข้อความ ==================== */
/* ข้อความบอทเก็บเป็นเวอร์ชัน (รองรับ Regenerate): {versions:[{text,time}], vi, rating} */
function lastVersion(m){ return m.versions ? m.versions[m.vi ?? m.versions.length - 1] : null; }
function msgText(m){ return m.role === 'assistant' ? (lastVersion(m)?.text ?? '') : m.text; }
function msgTime(m){ return m.role === 'assistant' ? (lastVersion(m)?.time ?? m.time) : m.time; }
/* ชิปเครื่องมือที่เอเจนต์ใช้ในคำตอบนั้น ๆ */
function toolChipsHtml(v){
  if (!v || !Array.isArray(v.tools) || !v.tools.length) return '';
  return '<div class="tool-chips">' + v.tools.map(t =>
    `<span class="tool-chip${t.ok ? '' : ' fail'}">${t.ok ? '✓' : '✗'} ${escapeHtml(t.name)}${t.ms != null ? ' · ' + Math.round(t.ms) + ' ms' : ''}</span>`).join('') + '</div>';
}

/* คำทักทายตามช่วงเวลา */
function greeting(){
  const h = new Date().getHours();
  if (h < 6)  return 'สวัสดีตอนดึก';
  if (h < 12) return 'สวัสดีตอนเช้า';
  if (h < 17) return 'สวัสดีตอนบ่าย';
  return 'สวัสดีตอนเย็น';
}

/* หน้าจอเริ่มต้น + การ์ดคำแนะนำ */
const SUGGESTIONS = [
  { icon:'i-mail', title:'ช่วยเขียนอีเมล',   sub:'ร่างอีเมลธุรกิจอย่างมืออาชีพ',   msg:'ช่วยเขียนอีเมลภาษาไทยแจ้งขอเลื่อนนัดประชุมอย่างสุภาพ' },
  { icon:'i-code', title:'อธิบายโค้ด',       sub:'แปลงโค้ดเป็นคำอธิบายเข้าใจง่าย', msg:'อธิบายการทำงานของโค้ดนี้ทีละบรรทัด พร้อมตัวอย่าง:\n\nfunction fib(n){ return n < 2 ? n : fib(n-1) + fib(n-2); }' },
  { icon:'i-map',  title:'วางแผนเที่ยว',     sub:'จัดทริปพร้อมงบประมาณ',          msg:'ช่วยวางแผนเที่ยวเชียงใหม่ 3 วัน 2 คืน พร้อมงบประมาณคร่าว ๆ' },
  { icon:'i-doc',  title:'สรุปบทความ',       sub:'สรุปใจความสำคัญให้กระชับ',      msg:'ช่วยสรุปบทความต่อไปนี้ให้เหลือ 5 บรรทัด:\n\n(วางบทความของคุณที่นี่)' },
];
const HANDS_ART = `<svg class="hands-art" viewBox="0 12 200 172" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
<path class="fl" fill="currentColor" fill-opacity=".2" d="M44 66c-8-8-5-22 6-25c1-13 15-21 27-15c7-10 25-10 31 1c13-4 25 5 24 17c10 5 11 19 1 25c-8 6-17 3-22 0c-7 7-19 7-26 0c-8 6-19 5-25-1c-8 3-15-1-16-2z"/>
<path d="M93 114c1-14 2-24 3-42M101 114c0-14-1-24-5-42"/><path d="M96 94l-13-13M97 88l12-12M97 100l9-8"/>
<path class="fl" fill="currentColor" fill-opacity=".2" d="M78 117c5-6 12-8 21-8s17 2 24 8"/>
<path d="M123 117c-8-6-22-7-34-3c-10 3-18 8-22 14"/>
<path d="M67 128c-10-3-24-3-30 2c-5 4-3 10 4 11l30 0"/><path d="M71 139c-12-1-28 0-33 5c-4 4-1 9 6 10l34-1"/><path d="M78 150c-10 0-24 1-28 6c-3 4 0 9 7 9l38-2"/>
<path d="M123 117c14 5 28 14 40 22c9 6 14 10 22 13"/><path d="M95 165c26 2 50 4 72 8c8 1 13 3 17 5"/><path d="M185 152c5 8 4 17-1 26"/>
<path d="M96 128c4 6 6 12 6 18M112 130c4 6 5 12 4 18"/></g></svg>`;
/* วาดเส้นภาพมือถือต้นไม้ทีละเส้น (Web Animations API) */
function drawHandsArt(root){
  try{
    const base = Math.max(0, 2000 - performance.now());
    root.querySelectorAll('.hands-art path').forEach((pa,i)=>{
      pa.setAttribute('pathLength','1'); pa.style.strokeDasharray='1';
      pa.animate([{strokeDashoffset:1},{strokeDashoffset:0}],{duration:900,delay:base+i*90,easing:'cubic-bezier(.4,0,.2,1)',fill:'both'});
      if (pa.classList.contains('fl')) pa.animate([{fillOpacity:0},{fillOpacity:.2}],{duration:700,delay:base+i*90+500,fill:'both'});
    });
    const h=root.querySelector('h1'); if(h) h.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:800,delay:base+900,easing:'ease',fill:'both'});
  }catch(e){}
}
function renderEmptyState(container){
  const name = state.settings.userName || '';
  const el = document.createElement('div');
  el.className = 'empty-state';
  el.innerHTML = `${HANDS_ART}<h1>สวัสดี${name ? ', คุณ' + escapeHtml(name.replace(/^คุณ/,'')) : ''}</h1>`;
 drawHandsArt(el);
  container.appendChild(el);
}

/* เรนเดอร์บทสนทนาทั้งหมดของแชทปัจจุบัน */
function renderConversation(){
  const box = $('#chatContainer');
  box.innerHTML = '';
  const chat = currentChat();
  $('#chatTitle').textContent = chat ? chat.title : 'แชทใหม่';
  $('#exportBtn').disabled = !chat || !chat.messages.length;
  if (!chat || !chat.messages.length){ renderEmptyState(box); return; }
  chat.messages.forEach(m => box.appendChild(buildMessageEl(m)));
  scrollToBottom(false);
}

/* สร้าง DOM ของข้อความ 1 ข้อความ */
function buildMessageEl(m){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant');
  wrap.dataset.id = m.id;

  if (m.role === 'user'){
    wrap.innerHTML = `
      <div class="msg-body">
        <div class="user-bubble">${escapeHtml(m.text)}</div>
        ${attachHtml(m)}
        <div class="msg-actions">
          <button class="msg-action-btn" data-act="copy" title="คัดลอก" aria-label="คัดลอกข้อความ"><svg width="15" height="15"><use href="#i-copy"/></svg></button>
          <button class="msg-action-btn" data-act="edit" title="แก้ไข" aria-label="แก้ไขข้อความ"><svg width="15" height="15"><use href="#i-edit"/></svg></button>
        </div>
        <div class="msg-time">${fmtTime(m.time)}</div>
      </div>`;
  } else {
    const v = lastVersion(m);
    wrap.innerHTML = `
      <div class="msg-avatar" aria-hidden="true"><svg width="19" height="19"><use href="#i-sprout"/></svg></div>
      <div class="msg-body">
        <div class="md" data-md></div>${toolChipsHtml(v)}
        <div class="msg-actions ${m.rating ? 'sticky' : ''}" data-actions>
          <button class="msg-action-btn" data-act="copy" title="คัดลอก" aria-label="คัดลอกคำตอบ"><svg width="15" height="15"><use href="#i-copy"/></svg></button>
          <button class="msg-action-btn" data-act="regen" title="สร้างคำตอบใหม่" aria-label="สร้างคำตอบใหม่"><svg width="15" height="15"><use href="#i-refresh"/></svg></button>
          <button class="msg-action-btn ${m.rating==='up'?'on':''}" data-act="up" title="คำตอบดี" aria-label="ให้คะแนนคำตอบดี"><svg width="15" height="15"><use href="#i-thumb-up"/></svg></button>
          <button class="msg-action-btn ${m.rating==='down'?'on':''}" data-act="down" title="คำตอบไม่ดี" aria-label="ให้คะแนนคำตอบไม่ดี"><svg width="15" height="15"><use href="#i-thumb-down"/></svg></button>
          <button class="msg-action-btn" data-act="speak" title="อ่านออกเสียง" aria-label="อ่านออกเสียง"><svg width="15" height="15"><use href="#i-volume"/></svg></button>
          ${m.versions.length > 1 ? `
          <span class="version-nav" aria-label="สลับเวอร์ชันคำตอบ">
            <button data-act="vprev" aria-label="เวอร์ชันก่อนหน้า" ${m.vi===0?'disabled':''}><svg width="13" height="13"><use href="#i-left"/></svg></button>
            <span>${(m.vi ?? m.versions.length-1)+1}/${m.versions.length}</span>
            <button data-act="vnext" aria-label="เวอร์ชันถัดไป" ${m.vi>=m.versions.length-1?'disabled':''}><svg width="13" height="13"><use href="#i-right"/></svg></button>
          </span>` : ''}
        </div>
        <div class="msg-time">${fmtTime(v.time)}</div>
      </div>`;
    mountMarkdown(wrap.querySelector('[data-md]'), v.text);
  }
  bindMessageActions(wrap, m);
  return wrap;
}

/* แสดงไฟล์แนบของข้อความผู้ใช้ */
function attachHtml(m){
  if (!m.attachments || !m.attachments.length) return '';
  return `<div class="attach-chips" style="margin:6px 0 0">` + m.attachments.map(a => `
    <span class="chip">
      ${a.dataUrl && a.type.startsWith('image/') ? `<img src="${a.dataUrl}" alt="">` : '<svg width="13" height="13"><use href="#i-doc"/></svg>'}
      <span class="chip-name">${escapeHtml(a.name)}</span>
    </span>`).join('') + `</div>`;
}
</script>
<script>
/* ==================== 7.1) ปุ่มการทำงานของข้อความ ==================== */
function bindMessageActions(wrap, m){
  const chat = currentChat();
  wrap.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', () => {
      const act = btn.dataset.act;

      if (act === 'copy'){
        copyText(m.role === 'user' ? m.text : lastVersion(m).text);
      }
      if (act === 'up' || act === 'down'){
        /* 👍/👎 กดซ้ำ = ยกเลิก */
        m.rating = (m.rating === act) ? null : act;
        saveChats(); refreshAssistantMsg(wrap, m);
      }
      if (act === 'speak') speakText(mdToPlain(lastVersion(m).text), btn);
      if (act === 'regen' && !state.generating) regenerate(m);
      if (act === 'vprev' || act === 'vnext'){
        m.vi = Math.min(Math.max((m.vi ?? m.versions.length-1) + (act === 'vnext' ? 1 : -1), 0), m.versions.length - 1);
        saveChats(); refreshAssistantMsg(wrap, m);
      }
      if (act === 'edit' && m.role === 'user') startEditUserMessage(wrap, m, chat);
    });
  });
}

/* เรนเดอร์ข้อความบอทใหม่ใน DOM เดิม (ใช้ตอนสลับเวอร์ชัน/ให้คะแนน) */
function refreshAssistantMsg(wrap, m){
  const fresh = buildMessageEl(m);
  wrap.replaceWith(fresh);
}

/* แก้ไขข้อความผู้ใช้แบบ inline แล้วส่งใหม่ (ลบคำตอบหลังจุดนั้นทิ้ง) */
function startEditUserMessage(wrap, m, chat){
  if (state.generating) return;
  const bubble = wrap.querySelector('.user-bubble');
  const box = document.createElement('div');
  box.className = 'edit-box';
  box.innerHTML = `
    <textarea aria-label="แก้ไขข้อความ">${escapeHtml(m.text)}</textarea>
    <div class="edit-actions">
      <button class="btn ghost" data-e="cancel">ยกเลิก</button>
      <button class="btn primary" data-e="send">บันทึกและส่งใหม่</button>
    </div>`;
  bubble.replaceWith(box);
  const ta = box.querySelector('textarea');
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  box.querySelector('[data-e="cancel"]').addEventListener('click', () => renderConversation());
  box.querySelector('[data-e="send"]').addEventListener('click', () => {
    const newText = ta.value.trim();
    if (!newText) return;
    const idx = chat.messages.findIndex(x => x.id === m.id);
    m.text = newText; m.time = Date.now();
    /* ลบข้อความทั้งหมดหลังจุดที่แก้ */
    chat.messages = chat.messages.slice(0, idx + 1);
    chat.updatedAt = Date.now();
    saveChats(); renderConversation();
    generateReply(chat);
  });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); box.querySelector('[data-e="send"]').click(); }
    if (e.key === 'Escape') renderConversation();
  });
}

/* อ่านออกเสียงด้วย Web Speech API (เลือกเสียงภาษาไทยถ้ามี) */
let speakingBtn = null;
function speakText(text, btn){
  if (!('speechSynthesis' in window)){ toast('เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง', 'error'); return; }
  if (speechSynthesis.speaking){ speechSynthesis.cancel(); if (speakingBtn === btn){ speakingBtn = null; return; } }
  const u = new SpeechSynthesisUtterance(text.slice(0, 4000));
  u.lang = 'th-TH';
  const thVoice = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('th'));
  if (thVoice) u.voice = thVoice;
  speakingBtn = btn;
  u.onend = u.onerror = () => { speakingBtn = null; };
  speechSynthesis.speak(u);
  toast('กำลังอ่านออกเสียง… (กดซ้ำเพื่อหยุด)');
}

/* เลื่อนตามข้อความใหม่เฉพาะตอนผู้ใช้อยู่ล่างสุดอยู่แล้ว */
function maybeAutoScroll(){ if (!userScrolledUp) chatScroll.scrollTop = chatScroll.scrollHeight; }

/* ==================== 8) ติดต่อเซิร์ฟเวอร์เอเจนต์ ====================
   หน้านี้ให้บริการโดย agent-server จึงเรียก API ของ origin เดียวกัน:
     POST /api/agent/run (ส่งข้อความ+ไฟล์แนบ base64) · /stop · /clear
     GET  /api/agent/events (SSE ความคืบหน้าเครื่องมือ)
     GET/PUT /api/agent/settings · GET /api/agent/profiles
   API key อยู่ในหน่วยความจำของเซิร์ฟเวอร์เท่านั้น ไม่เคยถูกเก็บในเบราว์เซอร์
   ========================================================================== */
let serverCtx = { chatId: null, count: 0 };   // แชทที่เอเจนต์ฝั่งเซิร์ฟเวอร์จำอยู่ + จำนวนข้อความที่เห็นแล้ว
let runTools = [];                            // เครื่องมือที่ทำงานในรอบนี้ (จาก SSE)
let evSource = null;
let activityEl = null;                        // กล่องแสดงความคืบหน้าสดใต้ typing indicator

let authUser = null;   // signed-in Firebase user (null when the server uses a token or no auth)
let fb = null;         // { auth, signOut } once Firebase is active

function goLogin(reason){
  const url = '/login.html?next=' + encodeURIComponent(location.pathname + location.search) + (reason ? '&reason=' + reason : '');
  (window.__navigate || function(u){ location.replace(u); })(url);
}
async function loadFirebaseSdk(){
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [app, auth] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js')]);
  return { initializeApp: app.initializeApp, getAuth: auth.getAuth, onAuthStateChanged: auth.onAuthStateChanged, signOut: auth.signOut };
}
/* Returns false when the visitor is being sent to the login page. */
async function authInit(){
  if (state.settings.mockMode) return true;
  let cfg = null;
  try{ const r = await fetch('/api/auth/config'); if (r.ok) cfg = await r.json(); }catch(e){ /* server unreachable: loadServerInfo reports it */ }
  if (!cfg || cfg.mode !== 'firebase') return true;       // token / no auth: behave as before
  const sdk = await (window.__firebaseLoader || loadFirebaseSdk)();
  const auth = sdk.getAuth(sdk.initializeApp(cfg.firebase));
  let off;
  const user = await new Promise(function(resolve){ off = sdk.onAuthStateChanged(auth, resolve); });
  if (typeof off === 'function') off();
  if (!user){ goLogin(); return false; }
  fb = { auth: auth, signOut: sdk.signOut };
  authUser = user;
  return true;
}
async function currentToken(){
  if (fb && fb.auth.currentUser){
    try{ return await fb.auth.currentUser.getIdToken(); }catch(e){ goLogin(); }   // refreshes automatically when expired
  }
  return state.settings.serverToken || '';
}
async function authFailure(status){
  if (!fb) return;
  if (status === 403){ try{ await fb.signOut(fb.auth); }catch(e){} goLogin('forbidden'); }
  else if (status === 401){ goLogin(); }
}
function apiHeaders(extra, token){
  const h = Object.assign({ 'Content-Type': 'application/json' }, extra || {});
  if (token) h['Authorization'] = 'Bearer ' + token;
  return h;
}
async function apiFetch(path, opts){
  const token = await currentToken();
  try{
    return await fetch(path, Object.assign({}, opts, { headers: apiHeaders(opts && opts.headers, token) }));
  }catch(err){
    if (err && err.name === 'AbortError') throw err;
    throw { type:'network', message:'เชื่อมต่อเซิร์ฟเวอร์เอเจนต์ไม่ได้ โปรดตรวจสอบว่าเซิร์ฟเวอร์ยังทำงานอยู่' };
  }
}
function httpError(status, data){
  const detail = data && data.error ? String(data.error) : '';
  if (status === 499) return { name:'AbortError' };
  if (status === 401) return { type:'auth', message:'เซิร์ฟเวอร์ต้องการ token ที่ถูกต้อง — ใส่ใน ตั้งค่า → การเชื่อมต่อ API' };
  if (status === 503) return { type:'config', message: detail || 'เซิร์ฟเวอร์ยังไม่มี API key — เปิด ตั้งค่า → การเชื่อมต่อ API เพื่อใส่คีย์' };
  if (status === 409) return { type:'busy', message:'เอเจนต์กำลังทำงานอื่นอยู่ โปรดรอสักครู่แล้วลองใหม่' };
  if (status === 429) return { type:'rate', message:'ส่งคำขอถี่เกินไป โปรดรอสักครู่แล้วลองใหม่' };
  if (status === 413) return { type:'api', message:'ข้อความหรือไฟล์แนบใหญ่เกินไป' };
  return { type:'api', message: detail || ('เซิร์ฟเวอร์ตอบกลับด้วย HTTP ' + status) };
}
async function apiJson(path, opts){
  const res = await apiFetch(path, opts);
  let data = null;
  try{ data = await res.json(); }catch(e){ /* ไม่มีเนื้อหา JSON */ }
  if (!res.ok){ if (fb) authFailure(res.status); throw httpError(res.status, data); }
  return data;
}

/* ---- Public chat (/api/chat): plain chat for signed-in visitors, history stored per user on the server ---- */
const PUBLIC_ERRORS = {
  'Too many requests': ['rate', 'ส่งถี่เกินไป โปรดรอสักครู่แล้วลองใหม่'],
  'Chat limit reached; delete an old chat first': ['rate', 'ถึงจำนวนแชทสูงสุดแล้ว โปรดลบแชทเก่าก่อน'],
  'This chat is full; start a new one': ['rate', 'แชทนี้ยาวเต็มแล้ว โปรดเริ่มแชทใหม่'],
  'The service has reached its daily limit; try again tomorrow': ['rate', 'บริการถึงขีดจำกัดของวันนี้แล้ว โปรดลองใหม่พรุ่งนี้'],
  'A reply is already being written': ['busy', 'กำลังตอบข้อความก่อนหน้าอยู่ โปรดรอสักครู่'],
  'The model is not configured on the server': ['api', 'เซิร์ฟเวอร์ยังไม่ได้ตั้งค่าโมเดล'],
  'Chat storage is not configured': ['api', 'เซิร์ฟเวอร์ยังไม่ได้ตั้งค่าที่เก็บแชท'],
  'Chat not found': ['api', 'ไม่พบแชทนี้ อาจถูกลบไปแล้ว'],
  'The model could not answer right now': ['api', 'โมเดลตอบไม่ได้ในขณะนี้ ลองใหม่อีกครั้ง'],
};
function publicHttpError(status, data){
  const detail = data && data.error ? String(data.error) : '';
  if (PUBLIC_ERRORS[detail]) return { type: PUBLIC_ERRORS[detail][0], message: PUBLIC_ERRORS[detail][1] };
  if (/^Daily quota/.test(detail)) return { type:'rate', message:'โควตาวันนี้หมดแล้ว จะรีเซ็ตเวลา 00:00 UTC' };
  const tooLong = /^Message is too long \((\d+)/.exec(detail);
  if (tooLong) return { type:'api', message:'ข้อความยาวเกินไป (สูงสุด ' + tooLong[1] + ' ตัวอักษร)' };
  return httpError(status, data);
}
function setUsage(u){ if (u){ pub.usage = u; renderModelMenu(); } }
async function publicFail(res){
  let data = null;
  try{ data = await res.json(); }catch(e){ /* no JSON body */ }
  if (fb) authFailure(res.status);
  if (data && data.usage) setUsage(data.usage);
  throw publicHttpError(res.status, data);
}
async function publicJson(path, opts){
  const res = await apiFetch(path, opts);
  if (!res.ok) await publicFail(res);
  try{ return await res.json(); }catch(e){ return null; }
}
async function loadPublicChats(){
  const data = await publicJson('/api/chat/chats');
  state.chats = (data && Array.isArray(data.chats) ? data.chats : []).map(c => ({
    id: c.id, title: c.title || 'แชทใหม่', pinned: false, remote: true, loaded: false, messages: [],
    createdAt: Date.parse(c.createdAt) || Date.now(), updatedAt: Date.parse(c.updatedAt) || Date.now(),
  }));
}
function toLocalMessage(m){
  const time = Date.parse(m.createdAt) || Date.now();
  return m.role === 'user'
    ? { id: uid(), role:'user', text: String(m.content || ''), time }
    : { id: uid(), role:'assistant', versions:[{ text: String(m.content || ''), time }], vi:0, rating:null };
}
async function loadPublicMessages(chat){
  if (!chat || !chat.remote || chat.loaded) return;
  try{
    const data = await publicJson('/api/chat/chats/' + encodeURIComponent(chat.id));
    if (chat.loaded) return;
    chat.messages = (data && Array.isArray(data.messages) ? data.messages : []).map(toLocalMessage);
    chat.loaded = true;
    if (state.currentId === chat.id) renderConversation();
  }catch(e){ toast((e && e.message) || 'เปิดแชทไม่สำเร็จ', 'error'); }
}
/* Returns null once public mode is on, or { status, data } when the server refuses this account. */
async function enterPublicMode(){
  const r = await apiFetch('/api/chat/me');
  let me = null;
  try{ me = await r.json(); }catch(e){ /* no JSON body */ }
  if (!r.ok) return { status: r.status, data: me };
  pub.active = true;
  pub.usage = (me && me.usage) || null;
  pub.modelReady = !!(me && me.modelReady);
  document.body.classList.add('pub-mode');
  Object.assign(server, { online: true, model: '', hasApiKey: true, profiles: [] });
  state.chats = []; state.currentId = null;      // never show this browser's agent chats to a public account
  await loadPublicChats();
  renderChatList(); renderConversation();
  return null;
}
/* One streamed answer. The chat is created on the server with the first message, so an unused draft costs nothing. */
async function callPublicChat(chat, text, signal, onToken){
  if (!chat.remote){
    const made = await publicJson('/api/chat/chats', { method:'POST', signal, body: '{}' });
    const wasCurrent = state.currentId === chat.id;
    chat.id = made.id; chat.remote = true; chat.loaded = true;
    if (wasCurrent) state.currentId = made.id;
  }
  const res = await apiFetch('/api/chat/chats/' + encodeURIComponent(chat.id) + '/messages', { method:'POST', signal, body: JSON.stringify({ content: text }) });
  if (!res.ok) await publicFail(res);
  let full = '';
  const frame = block => {
    const line = block.split('\n').find(l => l.startsWith('data:'));
    if (!line) return;
    let ev; try{ ev = JSON.parse(line.slice(5).trim()); }catch(e){ return; }
    if (ev.delta){ full += ev.delta; onToken(ev.delta); }
    if (ev.usage) setUsage(ev.usage);
    if (ev.error) throw publicHttpError(200, { error: ev.error });
  };
  if (res.body && res.body.getReader){
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    try{
      for (;;){
        const part = await reader.read();
        if (part.done) break;
        buf += dec.decode(part.value, { stream:true });
        let cut;
        while ((cut = buf.indexOf('\n\n')) >= 0){ const block = buf.slice(0, cut); buf = buf.slice(cut + 2); frame(block); }
      }
      if (buf.trim()) frame(buf);
    } finally { try{ reader.cancel(); }catch(e){ /* already closed */ } }
  } else {
    (await res.text()).split('\n\n').forEach(frame);
  }
  if (!full) throw { type:'api', message:'ไม่ได้รับคำตอบจากโมเดล ลองใหม่อีกครั้ง' };
  return full;
}

/* ดึงโมเดล/ผู้ให้บริการ/โปรไฟล์ปัจจุบันจากเซิร์ฟเวอร์ */
async function loadServerInfo(){
  if (state.settings.mockMode){ renderModelMenu(); return; }
  try{
    /* settings first and on its own: a 403 here is not a reason to sign out, it may just mean "public chat only" */
    const res = await apiFetch('/api/agent/settings');
    let cfg = null;
    try{ cfg = await res.json(); }catch(e){ /* no JSON body */ }
    if (!res.ok){
      if (res.status === 403 && fb){
        const refused = await enterPublicMode();
        if (!refused){ renderModelMenu(); return; }
        authFailure(refused.status);
        throw publicHttpError(refused.status, refused.data);
      }
      authFailure(res.status);
      throw httpError(res.status, cfg);
    }
    const profiles = await apiJson('/api/agent/profiles').catch(() => []);
    Object.assign(server, {
      online: true, provider: cfg.provider, model: cfg.model || '', baseUrl: cfg.baseUrl || '',
      hasApiKey: !!cfg.hasApiKey, thinkingLevel: cfg.thinkingLevel || 'off', activeProfile: cfg.activeProfile || '',
      profiles: Array.isArray(profiles) ? profiles : (profiles && Array.isArray(profiles.profiles) ? profiles.profiles : []),
    });
  }catch(e){
    server.online = false;
    if (e && e.message) toast(e.message, 'error');
  }
  renderModelMenu();
}

/* ---- SSE: แสดงเครื่องมือที่เอเจนต์กำลังใช้แบบสด ---- */
function disconnectEvents(){ if (evSource){ evSource.close(); evSource = null; } }
let evRetries = 0;
async function connectEvents(){
  disconnectEvents();
  if (state.settings.mockMode || pub.active || !server.online || typeof EventSource === 'undefined') return;
  const token = await currentToken();
  const q = token ? '?token=' + encodeURIComponent(token) : '';
  const es = new EventSource('/api/agent/events' + q);
  evSource = es;
  es.onopen = () => { evRetries = 0; };
  es.onmessage = e => { let ev; try{ ev = JSON.parse(e.data); }catch(_){ return; } onAgentEvent(ev); };
  es.onerror = () => {
    if (es.readyState !== 2) return;                      // the browser is retrying by itself
    if (evSource === es) evSource = null;
    /* A closed stream with Firebase usually means the ID token expired — reconnect with a fresh one. */
    if (fb && evRetries++ < 5) setTimeout(connectEvents, 3000);
  };
}
function onAgentEvent(ev){
  if (!state.generating) return;
  if (ev.type === 'toolEnd') runTools.push({ name: ev.tool, ok: ev.success !== false, ms: ev.duration });
  const line =
    ev.type === 'toolStart' ? '⚙ ' + ev.tool + ' …' :
    ev.type === 'toolEnd' ? (ev.success !== false ? '✓ ' : '✗ ') + ev.tool + (ev.duration != null ? ' · ' + Math.round(ev.duration) + ' ms' : '') :
    ev.type === 'providerRetry' ? '↻ ลองเรียกโมเดลใหม่ (ครั้งที่ ' + ev.attempt + ')' :
    ev.type === 'contextCompressed' ? '▣ บีบอัดบริบทของบทสนทนา' :
    ev.type === 'securityAlert' ? '⚠ ตรวจพบเหตุการณ์ด้านความปลอดภัย' : null;
  if (!line || !activityEl || !activityEl.isConnected) return;
  const li = document.createElement('div');
  li.textContent = line;
  activityEl.appendChild(li);
  while (activityEl.children.length > 6) activityEl.firstChild.remove();
  maybeAutoScroll();
}

/* เอเจนต์ฝั่งเซิร์ฟเวอร์จำบทสนทนาได้ทีละเรื่อง — ส่งบริบทของแชทนี้ให้ครบเมื่อจำเป็น */
const REPLAY_MAX_MSGS = 24, REPLAY_MAX_CHARS = 12000, REPLAY_PER_MSG = 2000;
function transcriptOf(list){
  const parts = [];
  let total = 0;
  for (let i = list.length - 1; i >= 0 && parts.length < REPLAY_MAX_MSGS; i--){
    const m = list[i];
    let t = String(msgText(m) || '').trim();
    if (m.attachments && m.attachments.length) t += ' [ไฟล์แนบ: ' + m.attachments.map(a => a.name).join(', ') + ']';
    if (!t) continue;
    if (t.length > REPLAY_PER_MSG) t = t.slice(0, REPLAY_PER_MSG) + '…';
    const line = (m.role === 'user' ? 'ผู้ใช้: ' : 'ผู้ช่วย: ') + t;
    if (total + line.length > REPLAY_MAX_CHARS) break;
    total += line.length;
    parts.unshift(line);
  }
  return parts.join('\n\n');
}
function b64Utf8(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
/* ไฟล์แนบ → รูปแบบที่ /api/agent/run รับ (สูงสุด 8 ไฟล์ ไฟล์ที่อ่านไม่ได้จะถูกข้ามและแจ้งชื่อในข้อความ) */
function toServerAttachments(m){
  return (m.attachments || []).slice(0, 8).map(a => {
    if (a.dataUrl){ return { name: a.name, mimeType: a.type, data: a.dataUrl.slice(a.dataUrl.indexOf(',') + 1) }; }
    if (typeof a.text === 'string'){
      return { name: a.name, mimeType: a.type && a.type !== 'application/octet-stream' ? a.type : 'text/plain', data: b64Utf8(a.text) };
    }
    return null;
  }).filter(Boolean);
}
/* เตรียมคำขอสำหรับข้อความผู้ใช้ล่าสุดก่อนคำตอบ `msg` (ส่งใหม่ / สร้างคำตอบใหม่ / แก้ไขข้อความ) */
async function prepareRequest(chat, msg){
  const upto = chat.messages.findIndex(x => x.id === msg.id);
  const history = chat.messages.slice(0, upto);
  let last = history.length - 1;
  while (last >= 0 && history[last].role !== 'user') last--;
  const userMsg = history[last];
  const userText = userMsg ? String(userMsg.text || '') : '';
  if (state.settings.mockMode || pub.active || !userMsg) return { userText, message: userText, attachments: [] };

  const prior = history.slice(0, last);
  let message = userText.trim() || 'โปรดดูไฟล์ที่แนบ';
  const attachments = toServerAttachments(userMsg);
  const dropped = (userMsg.attachments || []).filter(a => !a.dataUrl && typeof a.text !== 'string').map(a => a.name);
  if (dropped.length) message += '\n\n(ไฟล์ที่ระบบยังอ่านไม่ได้: ' + dropped.join(', ') + ')';

  /* ถ้าเอเจนต์ไม่ได้จำแชทนี้อยู่ (สลับแชท/แก้ไข/สร้างใหม่/รีเฟรช) ให้ล้างแล้วส่งบทสนทนาก่อนหน้าแบบย่อไปด้วย */
  if (serverCtx.chatId !== chat.id || serverCtx.count !== prior.length){
    try{ await apiJson('/api/agent/clear', { method:'POST' }); }
    catch(e){ if (e && (e.type === 'network' || e.type === 'auth')) throw e; /* 404 = ยังไม่มีเอเจนต์ */ }
    const tr = transcriptOf(prior);
    if (tr) message = '[บริบทของบทสนทนาก่อนหน้า]\n' + tr + '\n[จบบริบท]\n\n' + message;
  }
  return { userText, message, attachments };
}

async function callChatAPI({ chat, userText, message, attachments, signal, onToken, onMeta }){
  if (state.settings.mockMode){
    return mockStreamReply([{ role:'user', content: userText }], signal, onToken);
  }
  if (pub.active) return callPublicChat(chat, userText, signal, onToken);
  runTools = [];
  const body = { message };
  if (attachments && attachments.length) body.attachments = attachments;
  const data = await apiJson('/api/agent/run', { method:'POST', signal, body: JSON.stringify(body) });
  const text = data && typeof data.response === 'string' ? data.response : '';
  if (onMeta) onMeta({ tools: runTools.slice(0, 30) });
  onToken(text || '(เอเจนต์ไม่ได้ส่งข้อความกลับมา)');
  return text;
}

/* ---- Mock: เลือกคำตอบตัวอย่างแล้วสตรีมทีละตัวอักษร ---- */
function pickMockReply(userText){
  const t = userText.toLowerCase();
  if (/สวัสดี|hello|hi|หวัดดี/.test(t)) return MOCK_HELLO;
  if (/โค้ด|code|function|python|javascript/.test(t)) return MOCK_CODE;
  if (/เที่ยว|ทริป|แผน/.test(t)) return MOCK_TRAVEL;
  if (/อีเมล|email|เมล/.test(t)) return MOCK_EMAIL;
  if (/ตาราง|table|เปรียบเทียบ/.test(t)) return MOCK_TABLE;
  if (/สูตร|คณิต|math|สมการ/.test(t)) return MOCK_MATH;
  return MOCK_GENERIC(userText);
}
function mockStreamReply(messages, signal, onToken){
  return new Promise((resolve, reject) => {
    const lastUser = [...messages].reverse().find(m => m.role === 'user');
    const full = pickMockReply(lastUser ? lastUser.content : '');
    let i = 0;
    (function tick(){
      if (signal.aborted){ reject({ name:'AbortError' }); return; }
      /* สตรีมทีละ 2-6 ตัวอักษร ให้ดูเป็นธรรมชาติ */
      const step = 2 + Math.floor(Math.random() * 5);
      const chunk = full.slice(i, i + step);
      i += step;
      onToken(chunk);
      if (i < full.length) setTimeout(tick, 12 + Math.random() * 40);
      else resolve(full);
    })();
  });
}
